# Profile for hive/HAfAH, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hafah

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/HAfAH"
  id: 308

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/denser and hive/haf_api_node), so `stable` is
# omitted and `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile (its only input).
  image: "registry.gitlab.syncad.com/hive/hafah/aidev-tests@sha256:3a93cff858bcfa03efcdcb945b5e078e0deb888414aa08acf3d3c9a73f8ea538"
  inputs: [".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The slots that install HAfAH (every one without `stack: false`) reach the shared
# HAF the `haf` project hosts (sandbox.shared haf, a HAF replayed to block 5000000)
# as AIDEV_EXTERNAL_HAF_HOST/_PORT. .aidev/run-checks.sh takes a copy-on-write clone
# of it per run, installs the candidate's own SQL into the clone and drops it on
# exit, so no data is copied and no HAfAH image is built. The consumer role is
# trusted from the fleet LAN: no secret. See .aidev/README.md.
sandbox:
  external:
    - name: haf
      provider: "haf/haf"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: lint, then install / reinstall of the candidate's SQL into a
# clone of the shared 5M-block HAF, a PostgREST smoke test of chain data and, for
# full and canary, the tavern pattern tests (CI's
# hafah_pytest_rest_api_pattern_tests). CI's pytest functional tests (testnet +
# hived), comparison tests and benchmarks aren't bound yet; see .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "shellcheck", "sql-registered", "install", "reinstall", "api-smoke", "tavern"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "reinstall", "api-smoke"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "shellcheck", "sql-registered", "install", "reinstall", "api-smoke", "tavern"]
    artifacts: ["test-results/canary/"]
  # There is no coverage measurement for SQL; `coverage` runs the tree-wide checks
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
