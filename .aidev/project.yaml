# Profile for hive/HAfAH, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hafah

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/HAfAH"
  id: 308

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/denser and hive/haf_api_node), so `stable` is
# omitted and `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile (its only input).
  image: "registry.gitlab.syncad.com/hive/hafah/aidev-tests@sha256:3a93cff858bcfa03efcdcb945b5e078e0deb888414aa08acf3d3c9a73f8ea538"
  inputs: [".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The slots that install HAfAH (every one without `stack: false`) reach the shared
# HAF the `haf` project hosts (sandbox.shared haf, a HAF replayed to block 5000000)
# as AIDEV_EXTERNAL_HAF_HOST/_PORT. .aidev/run-checks.sh takes a copy-on-write clone
# of it per run, installs the candidate's own SQL into the clone and drops it on
# exit, so no data is copied and no HAfAH image is built. The consumer role is
# trusted from the fleet LAN: no secret. See .aidev/README.md.
sandbox:
  external:
    - name: haf
      provider: "haf/haf"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: lint, then install / reinstall of the candidate's SQL into a
# clone of the shared 5M-block HAF, a PostgREST smoke test of chain data and, for
# full and canary, the tavern pattern tests (CI's
# hafah_pytest_rest_api_pattern_tests). CI's pytest functional tests (testnet +
# hived), comparison tests and benchmarks aren't bound yet; see .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    suites:
      - name: default
        adapter: command
        args: [".aidev/run-checks.sh", "full", "shellcheck", "sql-registered", "install", "reinstall", "api-smoke", "tavern"]
        artifacts: ["test-results/full/"]
      # Plans the `performance:` queries on a shape of the full-scale HAF. It
      # needs the host's `aidev` CLI and docker daemon, so it runs host-side
      # (`docker: true`), not in the runtime image, and reaches no fixture.
      - name: db_shape
        adapter: command
        args: [aidev, db, shape, check, --report, db-shape-report.json]
        stack: false
        docker: true
        mode: advisory
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "reinstall", "api-smoke"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "shellcheck", "sql-registered", "install", "reinstall", "api-smoke", "tavern"]
    artifacts: ["test-results/canary/"]
  # There is no coverage measurement for SQL; `coverage` runs the tree-wide checks
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Hot queries planned against a shape of the full-scale HAF on steem-18
# (docs/operations/db-shape.md in aidev): plans and predicted times only —
# response correctness stays with the 5M-block tavern suites. Each statement is
# the one inside the plpgsql function behind its endpoint, with that function's
# parameters written as values a full-scale chain has: block 100,000,000, the
# account `blocktrades` (id 440), the API's largest page. The values that select
# data are `${name}` placeholders whose `parameters` name the column deciding
# which values are troublesome, so `aidev db shape capture --queries` catalogues
# them and the check plans each query once per catalogued value; `value` is the
# default each is planned with. The SQL takes what a request carries, so the
# production workload (`workload:` below) plans real requests: an account (and a
# transacting account) by name, a JSON-RPC operation filter as its
# operation_filter_low/high bitmask, REST operation types as their
# comma-separated list, a transaction id as hex. The SQL translates them as the
# functions do: a name through hafd.accounts, the bitmask through
# hafah_backend.translate_get_account_history_filter. An account written as
# digits is taken as its id (no Hive name is all digits): that is how the shape's
# value catalog, which holds account_operations ids, and the defaults bind it, and
# it folds to a constant the planner estimates for that account; a name is a
# lookup the planner cannot see through, so it plans with the average account's
# estimate. A query's `api_methods` name the methods it serves; `parameter_map`
# where their requests carry its values. A condenser_api alias passes its
# parameters by position, so it has a declaration of its own (a YAML merge of
# the named method's) mapping `params.<index>`. A request that does not carry a
# mapped value (an unfiltered call against a filtered statement) is planned with
# its default. HAfAH serves irreversible data only and reads the
# hafd.* base tables: the functions resolve hive.app_get_irreversible_block()
# before the statement and plan it as a constant (the account history functions
# force custom plans), so the statements here write the shape's block,
# 110,696,250. `time.error_threshold` is proposed from `role` (aidev's rule: ±25%
# at ≤100 ms, ±50% at ≤1 s) and unapproved, so every time assertion warns until
# a maintainer approves it.
performance:
  mode: observe
  # What the db_shape check watches: a diff touching none of these (or this
  # profile) is reported `not applicable` without loading the shape. These
  # replace the default inputs (the decisions' files; under a command apply,
  # every non-documentation path), so they name everything the apply installs
  # and the scripts that install it. fnmatch globs, where `*` also crosses `/`:
  # `db/*.sql` covers db/hafah_app.sql as well as nested files, which
  # `db/**/*.sql` would miss.
  inputs:
    - backend/*.sql
    - endpoints/*.sql
    - db/*.sql
    - .aidev/shape-apply.sh
    - .aidev/shape-psql.sh
    - scripts/install_app.sh
    - scripts/common.sh
  shape:
    # workflow_access: the decision check reads the source, read-only; decision_user:
    # the restricted role that evaluates decision code steem-18's released hafah
    # lacks types for (hafah_backend.account_op_match) in a rolled-back scratch schema.
    source: {host: steem-18, container: haf-haf-1, database: haf_block_log, user: haf_admin, workflow_access: true, decision_user: aidev_decision}
    image: registry.gitlab.syncad.com/hive/haf:1.28.8
    # steem-18 haf_block_log at block 110,699,894 (2026-10-12), hafd.account_operations all-visible; value catalog includes transacting_account_id partners for the REST include/exclude declarations (HAfAH#80; partner row counts uncounted: no index leads that column); published to the fleet store.
    artifact: 21376e6ac4b76ad6c1dbea0cc46ad6647c98c852b0e6255d7e6a924f73777e67
    # Installs each tree's hafah_* code on its shape copy: scripts/install_app.sh's
    # own files and order, each psql call fed to $AIDEV_DB_SHAPE_PSQL on stdin
    # (the shape server has no network, so no DSN).
    apply: {command: [.aidev/shape-apply.sh]}
  # Production-traffic replay (aidev docs/operations/traffic-replay.md): `aidev
  # replay ab` replays the capture's hafah calls against a full-scale
  # haf_api_node, base build against candidate. The target node is operator
  # configuration, kept out of this public repository: pass it with
  # `--profile FILE` until aidev resolves targets from host-local config
  # (aidev#15922).
  replay:
    mode: observe
    # api.hive.blog 2025-11-22, 89,782 requests; JSON-RPC ids renumbered, credential query parameters dropped.
    captures: [583b0d0d526bde1a1fe5ca83631cd05145940551d78320c431931fd1fb96c42e]
    methods:
      - "account_history_api.*"
      - condenser_api.get_account_history
      - condenser_api.get_ops_in_block
      - condenser_api.get_transaction
      - condenser_api.enum_virtual_ops
      - "block_api.*"
      - "rest:/hafah-api/*"
    expected:
      - name: include-reversible-ignored
        methods:
          - "account_history_api.*"
          - condenser_api.get_account_history
          - condenser_api.get_ops_in_block
          - condenser_api.get_transaction
          - condenser_api.enum_virtual_ops
          - "block_api.*"
        params: [include_reversible]
        reason: hafah answers from irreversible blocks only and ignores include_reversible (HAfAH!338)
      - name: version-reports-build
        methods: ["rest:/version"]
        reason: /version answers the running build's commit
    inputs: ["backend/**", "endpoints/**", "db/**"]
  # The production workload `aidev db shape check` weighs the declared queries
  # by: the replay capture's calls of each query's `api_methods`, planned with
  # their real parameters through its `parameter_map`.
  workload:
    capture: 583b0d0d526bde1a1fe5ca83631cd05145940551d78320c431931fd1fb96c42e
    samples: 20
    max_cost_ratio: 1.2
    warm_rate: 1.0
  queries:
    # JSON-RPC account_history_api.get_account_history, no filter:
    # hafah_backend.ah_get_account_history's page statement with no type filter:
    # its uq1-walk branch (the two-step and rare-types branches fold away).
    # ${start} is _start as call_get_account_history passes it through
    # parse_acc_hist_start (negative, the default -1: the newest, max BIGINT);
    # the two-step branch's bound __last_seq is that start cut at the last
    # irreversible block, written as the start itself. ${limit} is _limit.
    - &jsonrpc-account-history
      name: jsonrpc-account-history
      sql: |
        SELECT
          CASE WHEN ho.trx_in_block < 0 THEN '0000000000000000000000000000000000000000' ELSE encode(ht.trx_hash, 'hex') END AS _trx_id,
          blk.block_num AS _block,
          CASE WHEN ho.trx_in_block < 0 THEN 4294967295 ELSE ho.trx_in_block END AS _trx_in_block,
          ho.op_pos::BIGINT AS _op_in_trx,
          hot.is_virtual AS _virtual_op,
          btrim(to_json(hb.created_at)::TEXT, '"') AS _timestamp,
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS _value,
          page.account_op_seq_no AS _operation_id
        FROM (
          (
            SELECT ao.operation_id, ao.account_op_seq_no
            FROM hafd.account_operations ao
            WHERE TRUE
              AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
              AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
              AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
            ORDER BY ao.account_op_seq_no DESC
            LIMIT ${limit}
          )
          UNION ALL
          (
            SELECT ao.operation_id, seqs.account_op_seq_no
            FROM (
              SELECT s.account_op_seq_no
              FROM hafd.account_operations s
              WHERE FALSE
                AND s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND s.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND (s.op_type_id = ANY(NULL::SMALLINT[])) IS TRUE
              ORDER BY s.account_op_seq_no DESC
              LIMIT ${limit}
            ) seqs
            CROSS JOIN LATERAL (
              SELECT ao.operation_id
              FROM hafd.account_operations ao
              WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.account_op_seq_no = seqs.account_op_seq_no
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              LIMIT 1
            ) ao
          )
          UNION ALL
          (
            SELECT rare.operation_id, rare.account_op_seq_no
            FROM (
              SELECT ao.operation_id, ao.account_op_seq_no
              FROM hafd.account_operations ao
              WHERE FALSE
                AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.op_type_id = ANY(NULL::SMALLINT[])
                AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              OFFSET 0
            ) rare
            ORDER BY rare.account_op_seq_no DESC
            LIMIT ${limit}
          )
          LIMIT ${limit}
        ) page
        CROSS JOIN LATERAL (SELECT hafd.operation_id_to_block_num(page.operation_id) AS block_num) blk
        JOIN hafd.operations ho ON ho.id = page.operation_id
        JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
        JOIN hafd.blocks hb ON hb.num = blk.block_num
        LEFT JOIN LATERAL (
          SELECT t.trx_hash FROM hafd.transactions t
          WHERE t.block_num = blk.block_num AND t.trx_in_block = ho.trx_in_block
          LIMIT 1
        ) ht ON TRUE
        ORDER BY page.account_op_seq_no ASC
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        start: {column: hafd.account_operations.account_op_seq_no, value: -1}  # the default: the newest
      limit: {param: limit, value: 1000, values: [1000]}
      api_methods: [account_history_api.get_account_history]
      parameter_map: {account: params.account, start: params.start, limit: params.limit}
      role:
        frequency: "per get_account_history call — the API's busiest method; a page is up to 1000 operations"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 500
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations, hafd.transactions, hafd.blocks]
        uses_index: [hive_account_operations_uq1, pk_hive_operations]
      time: {max_ms: 500, error_threshold: 0.5}

    # condenser_api.get_account_history: the same statement, its params [account, start, limit, operation_filter_low, operation_filter_high] by position.
    - <<: *jsonrpc-account-history
      name: condenser-account-history
      api_methods: [condenser_api.get_account_history]
      parameter_map: {account: params.0, start: params.1, limit: params.2}

    # condenser_api.get_account_history with named params: the same statement and the JSON-RPC names.
    - <<: *jsonrpc-account-history
      name: condenser-account-history-named
      api_methods: [condenser_api.get_account_history]

    # JSON-RPC account_history_api.get_account_history with an operation filter
    # (transfer_operation) the account has many of: ah_get_account_history's page
    # statement on its two-step branch, the newest matching seqs index-only from
    # hive_account_operations_uq1 (an Index Only Scan once HAF#364 adds
    # INCLUDE (op_type_id); an Index Scan on the current shape), then one uq1
    # probe per seq.
    - &jsonrpc-account-history-by-type
      name: jsonrpc-account-history-by-type
      sql: |
        SELECT
          CASE WHEN ho.trx_in_block < 0 THEN '0000000000000000000000000000000000000000' ELSE encode(ht.trx_hash, 'hex') END AS _trx_id,
          blk.block_num AS _block,
          CASE WHEN ho.trx_in_block < 0 THEN 4294967295 ELSE ho.trx_in_block END AS _trx_in_block,
          ho.op_pos::BIGINT AS _op_in_trx,
          hot.is_virtual AS _virtual_op,
          btrim(to_json(hb.created_at)::TEXT, '"') AS _timestamp,
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS _value,
          page.account_op_seq_no AS _operation_id
        FROM (
          (
            SELECT ao.operation_id, ao.account_op_seq_no
            FROM hafd.account_operations ao
            WHERE FALSE
              AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
              AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
              AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
            ORDER BY ao.account_op_seq_no DESC
            LIMIT ${limit}
          )
          UNION ALL
          (
            SELECT ao.operation_id, seqs.account_op_seq_no
            FROM (
              SELECT s.account_op_seq_no
              FROM hafd.account_operations s
              WHERE TRUE
                AND s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND s.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND (s.op_type_id = ANY(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high})))) IS TRUE
              ORDER BY s.account_op_seq_no DESC
              LIMIT ${limit}
            ) seqs
            CROSS JOIN LATERAL (
              SELECT ao.operation_id
              FROM hafd.account_operations ao
              WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.account_op_seq_no = seqs.account_op_seq_no
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              LIMIT 1
            ) ao
          )
          UNION ALL
          (
            SELECT rare.operation_id, rare.account_op_seq_no
            FROM (
              SELECT ao.operation_id, ao.account_op_seq_no
              FROM hafd.account_operations ao
              WHERE FALSE
                AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.op_type_id = ANY(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high})))
                AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              OFFSET 0
            ) rare
            ORDER BY rare.account_op_seq_no DESC
            LIMIT ${limit}
          )
          LIMIT ${limit}
        ) page
        CROSS JOIN LATERAL (SELECT hafd.operation_id_to_block_num(page.operation_id) AS block_num) blk
        JOIN hafd.operations ho ON ho.id = page.operation_id
        JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
        JOIN hafd.blocks hb ON hb.num = blk.block_num
        LEFT JOIN LATERAL (
          SELECT t.trx_hash FROM hafd.transactions t
          WHERE t.block_num = blk.block_num AND t.trx_in_block = ho.trx_in_block
          LIMIT 1
        ) ht ON TRUE
        ORDER BY page.account_op_seq_no ASC
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        filter_low: {column: hafd.account_operations.op_type_id, value: 4}  # bit 2: transfer_operation
        filter_high: {column: hafd.account_operations.op_type_id, value: 0}
        start: {column: hafd.account_operations.account_op_seq_no, value: -1}  # the default: the newest
      limit: {param: limit, value: 1000, values: [1000]}
      api_methods: [account_history_api.get_account_history]
      parameter_map: {account: params.account, start: params.start, limit: params.limit, filter_low: params.operation_filter_low, filter_high: params.operation_filter_high}
      role:
        frequency: "per filtered get_account_history call — exchanges and wallets polling deposits"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations, hafd.blocks]
        uses_index: [hive_account_operations_uq1, pk_hive_operations]
      time: {max_ms: 1000, error_threshold: 0.5}

    # condenser_api.get_account_history: the same statement, its params [account, start, limit, operation_filter_low, operation_filter_high] by position.
    - <<: *jsonrpc-account-history-by-type
      name: condenser-account-history-by-type
      api_methods: [condenser_api.get_account_history]
      parameter_map: {account: params.0, start: params.1, limit: params.2, filter_low: params.3, filter_high: params.4}

    # condenser_api.get_account_history with named params: the same statement and the JSON-RPC names.
    - <<: *jsonrpc-account-history-by-type
      name: condenser-account-history-by-type-named
      api_methods: [condenser_api.get_account_history]

    # JSON-RPC get_account_history with an operation filter the account has few
    # of (fewer than account_rare_match_threshold(limit, its operations)): ah_get_account_history's page
    # statement on its rare-types branch, every match by type then a sort.
    - &jsonrpc-account-history-by-rare-type
      name: jsonrpc-account-history-by-rare-type
      sql: |
        SELECT
          CASE WHEN ho.trx_in_block < 0 THEN '0000000000000000000000000000000000000000' ELSE encode(ht.trx_hash, 'hex') END AS _trx_id,
          blk.block_num AS _block,
          CASE WHEN ho.trx_in_block < 0 THEN 4294967295 ELSE ho.trx_in_block END AS _trx_in_block,
          ho.op_pos::BIGINT AS _op_in_trx,
          hot.is_virtual AS _virtual_op,
          btrim(to_json(hb.created_at)::TEXT, '"') AS _timestamp,
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS _value,
          page.account_op_seq_no AS _operation_id
        FROM (
          (
            SELECT ao.operation_id, ao.account_op_seq_no
            FROM hafd.account_operations ao
            WHERE FALSE
              AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
              AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
              AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
            ORDER BY ao.account_op_seq_no DESC
            LIMIT ${limit}
          )
          UNION ALL
          (
            SELECT ao.operation_id, seqs.account_op_seq_no
            FROM (
              SELECT s.account_op_seq_no
              FROM hafd.account_operations s
              WHERE FALSE
                AND s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND s.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND (s.op_type_id = ANY(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high})))) IS TRUE
              ORDER BY s.account_op_seq_no DESC
              LIMIT ${limit}
            ) seqs
            CROSS JOIN LATERAL (
              SELECT ao.operation_id
              FROM hafd.account_operations ao
              WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.account_op_seq_no = seqs.account_op_seq_no
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              LIMIT 1
            ) ao
          )
          UNION ALL
          (
            SELECT rare.operation_id, rare.account_op_seq_no
            FROM (
              SELECT ao.operation_id, ao.account_op_seq_no
              FROM hafd.account_operations ao
              WHERE TRUE
                AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.op_type_id = ANY(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high})))
                AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END
                AND ao.operation_id < hafd.operation_id(110696250 + 1, 0)
              OFFSET 0
            ) rare
            ORDER BY rare.account_op_seq_no DESC
            LIMIT ${limit}
          )
          LIMIT ${limit}
        ) page
        CROSS JOIN LATERAL (SELECT hafd.operation_id_to_block_num(page.operation_id) AS block_num) blk
        JOIN hafd.operations ho ON ho.id = page.operation_id
        JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
        JOIN hafd.blocks hb ON hb.num = blk.block_num
        LEFT JOIN LATERAL (
          SELECT t.trx_hash FROM hafd.transactions t
          WHERE t.block_num = blk.block_num AND t.trx_in_block = ho.trx_in_block
          LIMIT 1
        ) ht ON TRUE
        ORDER BY page.account_op_seq_no ASC
      parameters:
        account: {column: hafd.account_operations.account_id, value: "105331"}
        filter_low: {column: hafd.account_operations.op_type_id, value: 4}  # bit 2: transfer_operation
        filter_high: {column: hafd.account_operations.op_type_id, value: 0}
        start: {column: hafd.account_operations.account_op_seq_no, value: -1}  # the default: the newest
      limit: {param: limit, value: 1000, values: [1000]}
      api_methods: [account_history_api.get_account_history]
      parameter_map: {account: params.account, start: params.start, limit: params.limit, filter_low: params.operation_filter_low, filter_high: params.operation_filter_high}
      role:
        frequency: "per filtered get_account_history call whose types are rare for the account"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations, hafd.blocks]
        uses_index: [hive_account_operations_account_id_op_type_id_idx, pk_hive_operations]
      time: {max_ms: 1000, error_threshold: 0.5}

    # condenser_api.get_account_history: the same statement, its params [account, start, limit, operation_filter_low, operation_filter_high] by position.
    - <<: *jsonrpc-account-history-by-rare-type
      name: condenser-account-history-by-rare-type
      api_methods: [condenser_api.get_account_history]
      parameter_map: {account: params.0, start: params.1, limit: params.2, filter_low: params.3, filter_high: params.4}

    # condenser_api.get_account_history with named params: the same statement and the JSON-RPC names.
    - <<: *jsonrpc-account-history-by-rare-type
      name: condenser-account-history-by-rare-type-named
      api_methods: [condenser_api.get_account_history]

    # JSON-RPC get_account_history with an operation filter: the bounded count
    # that picks the page branch, hafah_backend.account_op_types_are_rare over
    # seqs [0, __last_seq]. Its LIMIT is account_rare_match_threshold(_limit, N),
    # N = __last_seq + 1, written out as production computes it with
    # hive_account_operations_uq1 INCLUDE (op_type_id) (HAF#364; the pinned shape
    # predates it, so the function would return the older sqrt(_limit * N)): 6129
    # for blocktrades at its 8.17M operations and limit 1000. __last_seq is the
    # start bounded by the default account's newest seq, 8172599, which the
    # planner cannot read per account. A start past every seq (the newest) counts
    # over the whole history with no seq predicate, as the function does when the
    # range covers it; any other start counts the bounded range.
    - &jsonrpc-account-history-type-count
      name: jsonrpc-account-history-type-count
      sql: |
        SELECT count(*) < (ceil((${limit} + sqrt(${limit}::FLOAT8 * ${limit} + 4 * ${limit}::FLOAT8 * (LEAST(CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END, 8172599) + 1) / 260)) / 2))::BIGINT
        FROM (
          SELECT
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.op_type_id = ANY(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high})))
            AND (CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END >= 2147483647 OR (ao.account_op_seq_no >= 0 AND ao.account_op_seq_no <= CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END))
          LIMIT (ceil((${limit} + sqrt(${limit}::FLOAT8 * ${limit} + 4 * ${limit}::FLOAT8 * (LEAST(CASE WHEN ${start}::BIGINT < 0 THEN 9223372036854775807 ELSE ${start}::BIGINT END, 8172599) + 1) / 260)) / 2))::BIGINT
        ) matches
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        filter_low: {column: hafd.account_operations.op_type_id, value: 4}  # bit 2: transfer_operation
        filter_high: {column: hafd.account_operations.op_type_id, value: 0}
        start: {column: hafd.account_operations.account_op_seq_no, value: -1}  # the default: the newest
      limit: {param: limit, value: 1000, values: [1000]}
      api_methods: [account_history_api.get_account_history]
      parameter_map: {account: params.account, start: params.start, limit: params.limit, filter_low: params.operation_filter_low, filter_high: params.operation_filter_high}
      role:
        frequency: "per filtered get_account_history call"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 100
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx]
      time: {max_ms: 100, error_threshold: 0.25}

    # condenser_api.get_account_history: the same statement, its params [account, start, limit, operation_filter_low, operation_filter_high] by position.
    - <<: *jsonrpc-account-history-type-count
      name: condenser-account-history-type-count
      api_methods: [condenser_api.get_account_history]
      parameter_map: {account: params.0, start: params.1, limit: params.2, filter_low: params.3, filter_high: params.4}

    # condenser_api.get_account_history with named params: the same statement and the JSON-RPC names.
    - <<: *jsonrpc-account-history-type-count
      name: condenser-account-history-type-count-named
      api_methods: [condenser_api.get_account_history]

    # REST GET /accounts/{account-name}/operations, first page, no filter:
    # hafah_backend.account_history_default (via get_ops_by_account). Its page is
    # LIMIT _calculate_pages.limit_filter from to_seq - offset_filter down: with no
    # page, the newest, offset 0 and count % page-size rows (page-size when that
    # is 0), planned at its bound ${page_size}.
    - name: rest-account-operations-page
      sql: |
        WITH operation_range AS MATERIALIZED (
          SELECT
            ls.operation_id AS id,
            ls.block_num,
            ho.trx_in_block,
            encode(ht.trx_hash, 'hex') AS trx_hash,
            ho.op_pos,
            ls.op_type_id,
            jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
            hot.is_virtual
          FROM (
            SELECT ao.operation_id, ao.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num
            FROM hafd.account_operations ao
            WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
              AND ao.account_op_seq_no >= 0
              AND ao.account_op_seq_no <= 2147483647
            ORDER BY ao.account_op_seq_no DESC
            LIMIT ${page_size}
          ) ls
          JOIN hafd.operations ho ON ho.id = ls.operation_id
          JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
          LEFT JOIN LATERAL (
            SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
            WHERE tx.block_num = ls.block_num AND tx.trx_in_block = ho.trx_in_block
            LIMIT 1
          ) ht ON TRUE
        )
        SELECT ov.*, hb.created_at
        FROM operation_range ov
        JOIN hafd.blocks hb ON hb.num = ov.block_num
        ORDER BY ov.id DESC
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, page_size: query.page-size}
      role:
        frequency: "per REST account-operations page — block explorers' account view"
        waiter: "REST client through PostgREST"
        latency_ms: 500
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations, hafd.transactions, hafd.blocks]
        uses_index: [hive_account_operations_uq1, pk_hive_operations]
      time: {max_ms: 500, error_threshold: 0.5}

    # The same request with ?page=N: calculate_pages' to_seq - offset_filter is
    # from_seq + N * page-size - 1 for every page (pages count from the oldest,
    # from_seq is the account's first seq, 0, with no block range), the newest
    # page's bound cut at to_seq.
    - name: rest-account-operations-page-at
      sql: |
        WITH operation_range AS MATERIALIZED (
          SELECT
            ls.operation_id AS id,
            ls.block_num,
            ho.trx_in_block,
            encode(ht.trx_hash, 'hex') AS trx_hash,
            ho.op_pos,
            ls.op_type_id,
            jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
            hot.is_virtual
          FROM (
            SELECT ao.operation_id, ao.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num
            FROM hafd.account_operations ao
            WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
              AND ao.account_op_seq_no >= 0
              AND ao.account_op_seq_no <= LEAST(${page} * ${page_size} - 1, 2147483647)
            ORDER BY ao.account_op_seq_no DESC
            LIMIT ${page_size}
          ) ls
          JOIN hafd.operations ho ON ho.id = ls.operation_id
          JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
          LEFT JOIN LATERAL (
            SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
            WHERE tx.block_num = ls.block_num AND tx.trx_in_block = ho.trx_in_block
            LIMIT 1
          ) ht ON TRUE
        )
        SELECT ov.*, hb.created_at
        FROM operation_range ov
        JOIN hafd.blocks hb ON hb.num = ov.block_num
        ORDER BY ov.id DESC
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        page: {column: hafd.account_operations.account_op_seq_no, value: 1}  # the oldest page
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, page: query.page, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request for a numbered page — paging back through an account"
        waiter: "REST client through PostgREST"
        latency_ms: 500
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations, hafd.transactions, hafd.blocks]
        uses_index: [hive_account_operations_uq1, pk_hive_operations]
      time: {max_ms: 500, error_threshold: 0.5}

    # REST GET /accounts/{account-name}/operations?to-block=…: the upper
    # sequence-number bound hafah_backend.account_range looks up for a block
    # range, cut at the last irreversible block.
    - name: rest-account-range-to-block
      sql: |
        SELECT ao.account_op_seq_no
        FROM hafd.account_operations ao
        WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
          AND ao.operation_id < hafd.operation_id(LEAST(${to_block}, 110696250) + 1, 0)
        ORDER BY ao.account_op_seq_no DESC
        LIMIT 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        to_block: {column: hafd.transactions.block_num, value: 90000000}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, to_block: query.to-block}
      role:
        frequency: "per REST account-operations request with a block range"
        waiter: "REST client through PostgREST"
        latency_ms: 200
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_uq1]
      time: {max_ms: 200, error_threshold: 0.5}

    # REST GET /accounts/{account-name}/operations?operation-types=…: the total
    # hafah_backend.get_account_operations_count computes for paging.
    - name: rest-account-operations-count-by-type
      sql: |
        SELECT COUNT(*)
        FROM hafd.account_operations ao
        WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
          AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types}
      role:
        frequency: "per REST account-operations request with an operation-type filter"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx]
      time: {max_ms: 1000, error_threshold: 0.5}

    # REST GET /accounts/{account-name}/operations?operation-types=… (no
    # participation filter): hafah_backend.account_history_by_operations' page
    # statement on its two-step uq1 branch, types the account has many of. Which
    # branch runs is decided from the count above (rest-account-operations-count-by-type).
    - name: rest-account-operations-by-type
      sql: |
        SELECT
          ls.operation_id AS id,
          ls.block_num,
          ho.trx_in_block,
          encode(ht.trx_hash, 'hex') AS trx_hash,
          ho.op_pos::INT AS op_pos,
          ls.op_type_id,
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
          hot.is_virtual
        FROM (
          (
            SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num
            FROM (
              SELECT s.account_op_seq_no, s.op_type_id
              FROM hafd.account_operations s
              WHERE NOT FALSE
                AND s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND (string_to_array(${op_type}::TEXT, ',')::INT[] IS NULL OR (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE)
                AND s.account_op_seq_no >= 0
                AND s.account_op_seq_no <= 2147483647
              ORDER BY s.account_op_seq_no DESC
              LIMIT ${page_size}
              OFFSET 0
            ) seqs
            CROSS JOIN LATERAL (
              SELECT ao.operation_id
              FROM hafd.account_operations ao
              WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.account_op_seq_no = seqs.account_op_seq_no
              LIMIT 1
            ) ao
          )
          UNION ALL
          (
            SELECT rare.operation_id, rare.op_type_id, hafd.operation_id_to_block_num(rare.operation_id) AS block_num
            FROM (
              SELECT ao.operation_id, ao.op_type_id, ao.account_op_seq_no
              FROM hafd.account_operations ao
              WHERE FALSE
                AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
                AND ao.account_op_seq_no >= 0
                AND ao.account_op_seq_no <= 2147483647
              OFFSET 0
            ) rare
            ORDER BY rare.account_op_seq_no DESC
            LIMIT ${page_size}
            OFFSET 0
          )
        ) ls
        JOIN hafd.operations ho ON ho.id = ls.operation_id
        JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
        LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = ls.block_num AND tx.trx_in_block = ho.trx_in_block
          LIMIT 1
        ) ht ON TRUE
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, page_size: query.page-size}
      role:
        frequency: "per REST account-operations page with an operation-type filter — wallets' transfer history"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations]
        uses_index: [hive_account_operations_uq1, pk_hive_operations]
      time: {max_ms: 1000, error_threshold: 0.5}

    # The same request when the types are rare for the account:
    # account_history_by_operations' rare-types branch, every match by type then
    # a sort.
    - name: rest-account-operations-by-rare-type
      sql: |
        SELECT
          ls.operation_id AS id,
          ls.block_num,
          ho.trx_in_block,
          encode(ht.trx_hash, 'hex') AS trx_hash,
          ho.op_pos::INT AS op_pos,
          ls.op_type_id,
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
          hot.is_virtual
        FROM (
          (
            SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num
            FROM (
              SELECT s.account_op_seq_no, s.op_type_id
              FROM hafd.account_operations s
              WHERE NOT TRUE
                AND s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND (string_to_array(${op_type}::TEXT, ',')::INT[] IS NULL OR (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE)
                AND s.account_op_seq_no >= 0
                AND s.account_op_seq_no <= 2147483647
              ORDER BY s.account_op_seq_no DESC
              LIMIT ${page_size}
              OFFSET 0
            ) seqs
            CROSS JOIN LATERAL (
              SELECT ao.operation_id
              FROM hafd.account_operations ao
              WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.account_op_seq_no = seqs.account_op_seq_no
              LIMIT 1
            ) ao
          )
          UNION ALL
          (
            SELECT rare.operation_id, rare.op_type_id, hafd.operation_id_to_block_num(rare.operation_id) AS block_num
            FROM (
              SELECT ao.operation_id, ao.op_type_id, ao.account_op_seq_no
              FROM hafd.account_operations ao
              WHERE TRUE
                AND ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
                AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
                AND ao.account_op_seq_no >= 0
                AND ao.account_op_seq_no <= 2147483647
              OFFSET 0
            ) rare
            ORDER BY rare.account_op_seq_no DESC
            LIMIT ${page_size}
            OFFSET 0
          )
        ) ls
        JOIN hafd.operations ho ON ho.id = ls.operation_id
        JOIN hafd.operation_types hot ON hot.id = ho.op_type_id
        LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = ls.block_num AND tx.trx_in_block = ho.trx_in_block
          LIMIT 1
        ) ht ON TRUE
      parameters:
        account: {column: hafd.account_operations.account_id, value: "105331"}
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, page_size: query.page-size}
      role:
        frequency: "per REST account-operations page whose operation types are rare for the account"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations, hafd.operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx, pk_hive_operations]
      time: {max_ms: 1000, error_threshold: 0.5}

    # The include and exclude variants (participation-mode=include|exclude with
    # transacting accounts) read a sliding window of up to 10 pages + 1 rows
    # (LIMIT 1001 at the default page size of 100) in their operation_range CTE,
    # on one of the branches chosen at run time; the rest of the statement reads
    # one page of it by primary key. Each typed branch is declared below as that
    # CTE's statement, the folded-away branches left out (the plain uq1 walk runs
    # only without a type filter). The transacting partner is its
    # own parameter, so a capture catalogues its heavy hitters and near-empty values.
    #
    # REST ?participation-mode=include with one transacting account, matches
    # common: hafah_backend.account_history_include_account's two-step branch,
    # the type matches newest first index-only from uq1, then each match's row
    # for the partner filter. account_rare_op_matches (below) chose it by counting
    # past account_rare_match_threshold(1001, N) matches. A rare partner on this
    # branch reads every type match (HAfAH#79).
    - name: rest-include-account-two-step
      sql: |
        SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num, seqs.account_op_seq_no
        FROM (
          SELECT s.account_op_seq_no, s.op_type_id
          FROM hafd.account_operations s
          WHERE s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE
            AND s.account_op_seq_no >= 0
            AND s.account_op_seq_no <= 2147483647
          ORDER BY s.account_op_seq_no DESC
          OFFSET 0
        ) seqs
        CROSS JOIN LATERAL (
          SELECT ao.operation_id, ao.transacting_account_id
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.account_op_seq_no = seqs.account_op_seq_no
          LIMIT 1
        ) ao
        WHERE ao.transacting_account_id = (CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)
        ORDER BY seqs.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # blocktrades' own transfers
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request filtered to one transacting account — transfers between two accounts"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_uq1]
      time: {max_ms: 1000, error_threshold: 0.5}

    # The include variants' rare/common decision and rare branch in one:
    # hafah_backend.account_rare_op_matches, called by account_history_include_account
    # (ARRAY[the partner]) and account_history_including_accounts (the partners),
    # reads every match by type up to account_rare_match_threshold(10 * page-size + 1, N),
    # N the account's operations (16006281 for 509861: 8367 at page-size 100 once
    # HAF#364 is in, 126576 before; written out with uq1's INCLUDE, as
    # jsonrpc-account-history-type-count). Fewer matches are the rare branch's
    # rows, which the page only sorts; more choose the two-step. Planned with the
    # heaviest account and a partner with 2 operations in all, so at most 2 matches.
    - name: rest-include-account-rare-matches
      sql: |
        SELECT ARRAY(
          SELECT (ao.operation_id, ao.op_type_id, ao.account_op_seq_no)
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
            AND ao.transacting_account_id = ANY(ARRAY[(CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)]::INT[])
            AND ao.account_op_seq_no >= 0
            AND ao.account_op_seq_no <= 2147483647
          LIMIT (ceil(((10 * ${page_size} + 1) + sqrt((10 * ${page_size} + 1)::FLOAT8 * (10 * ${page_size} + 1) + 4 * (10 * ${page_size} + 1)::FLOAT8 * 16006281 / 260)) / 2))::BIGINT
        )
      parameters:
        account: {column: hafd.account_operations.account_id, value: "509861"}
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "1342941"}
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request filtered to included transacting accounts and operation types"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx]
      time: {max_ms: 1000, error_threshold: 0.5}

    # REST ?participation-mode=include with several transacting accounts, matches
    # common: hafah_backend.account_history_including_accounts' two-step branch.
    # Its rare branch is rest-include-account-rare-matches.
    - name: rest-including-accounts-two-step
      sql: |
        SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num, seqs.account_op_seq_no
        FROM (
          SELECT s.account_op_seq_no, s.op_type_id
          FROM hafd.account_operations s
          WHERE s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE
            AND s.account_op_seq_no >= 0
            AND s.account_op_seq_no <= 2147483647
          ORDER BY s.account_op_seq_no DESC
          OFFSET 0
        ) seqs
        CROSS JOIN LATERAL (
          SELECT ao.operation_id, ao.transacting_account_id
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.account_op_seq_no = seqs.account_op_seq_no
          LIMIT 1
        ) ao
        WHERE ao.transacting_account_id = ANY(ARRAY[(CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)]::INT[])
        ORDER BY seqs.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # blocktrades' own transfers
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request filtered to several transacting accounts"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_uq1]
      time: {max_ms: 1000, error_threshold: 0.5}

    # REST ?participation-mode=exclude with one transacting account, types common
    # for the account: hafah_backend.account_history_exclude_account's two-step
    # branch. The exclude variants decide on types only
    # (account_op_types_are_rare, as jsonrpc-account-history-type-count).
    - name: rest-exclude-account-two-step
      sql: |
        SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num, seqs.account_op_seq_no
        FROM (
          SELECT s.account_op_seq_no, s.op_type_id
          FROM hafd.account_operations s
          WHERE s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE
            AND s.account_op_seq_no >= 0
            AND s.account_op_seq_no <= 2147483647
          ORDER BY s.account_op_seq_no DESC
          OFFSET 0
        ) seqs
        CROSS JOIN LATERAL (
          SELECT ao.operation_id, ao.transacting_account_id
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.account_op_seq_no = seqs.account_op_seq_no
          LIMIT 1
        ) ao
        WHERE ao.transacting_account_id != (CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)
          AND ao.transacting_account_id IS NOT NULL
        ORDER BY seqs.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # transfers blocktrades received
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request excluding one transacting account — incoming transfers"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_uq1]
      time: {max_ms: 1000, error_threshold: 0.5}

    # The same request when the types are rare for the account:
    # account_history_exclude_account's rare-types branch, every match by type
    # then a sort.
    - name: rest-exclude-account-rare
      sql: |
        SELECT rare.operation_id, rare.op_type_id, hafd.operation_id_to_block_num(rare.operation_id) AS block_num, rare.account_op_seq_no
        FROM (
          SELECT ao.operation_id, ao.op_type_id, ao.account_op_seq_no
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.transacting_account_id != (CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)
            AND ao.transacting_account_id IS NOT NULL
            AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
            AND ao.account_op_seq_no >= 0
            AND ao.account_op_seq_no <= 2147483647
          OFFSET 0
        ) rare
        ORDER BY rare.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "105331"}
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # blocktrades
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request excluding one transacting account, types rare for the account"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx]
      time: {max_ms: 1000, error_threshold: 0.5}

    # REST ?participation-mode=exclude with several transacting accounts, types
    # common: hafah_backend.account_history_excluding_accounts' two-step branch.
    - name: rest-excluding-accounts-two-step
      sql: |
        SELECT ao.operation_id, seqs.op_type_id, hafd.operation_id_to_block_num(ao.operation_id) AS block_num, seqs.account_op_seq_no
        FROM (
          SELECT s.account_op_seq_no, s.op_type_id
          FROM hafd.account_operations s
          WHERE s.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND (s.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])) IS TRUE
            AND s.account_op_seq_no >= 0
            AND s.account_op_seq_no <= 2147483647
          ORDER BY s.account_op_seq_no DESC
          OFFSET 0
        ) seqs
        CROSS JOIN LATERAL (
          SELECT ao.operation_id, ao.transacting_account_id
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.account_op_seq_no = seqs.account_op_seq_no
          LIMIT 1
        ) ao
        WHERE NOT (ao.transacting_account_id = ANY(ARRAY[(CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)]::INT[]))
          AND ao.transacting_account_id IS NOT NULL
        ORDER BY seqs.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "440"}  # blocktrades
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # blocktrades
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request excluding several transacting accounts"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_uq1]
      time: {max_ms: 1000, error_threshold: 0.5}

    # The same request when the types are rare for the account:
    # account_history_excluding_accounts' rare-types branch.
    - name: rest-excluding-accounts-rare
      sql: |
        SELECT rare.operation_id, rare.op_type_id, hafd.operation_id_to_block_num(rare.operation_id) AS block_num, rare.account_op_seq_no
        FROM (
          SELECT ao.operation_id, ao.op_type_id, ao.account_op_seq_no
          FROM hafd.account_operations ao
          WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END)
            AND ao.op_type_id = ANY(string_to_array(${op_type}::TEXT, ',')::INT[])
            AND ao.account_op_seq_no >= 0
            AND ao.account_op_seq_no <= 2147483647
            AND NOT (ao.transacting_account_id = ANY(ARRAY[(CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)]::INT[]))
            AND ao.transacting_account_id IS NOT NULL
          OFFSET 0
        ) rare
        ORDER BY rare.account_op_seq_no DESC
        LIMIT 10 * ${page_size} + 1
      parameters:
        account: {column: hafd.account_operations.account_id, value: "105331"}
        op_type: {column: hafd.account_operations.op_type_id, value: "2"}  # transfer_operation
        partner: {column: hafd.account_operations.transacting_account_id, value: "440"}  # blocktrades
      limit: {param: page_size, value: 100, values: [100]}
      api_methods: ["rest:/hafah-api/accounts/*/operations"]
      parameter_map: {account: path.3, op_type: query.operation-types, partner: query.transacting-account-name, page_size: query.page-size}
      role:
        frequency: "per REST account-operations request excluding several transacting accounts, types rare for the account"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.account_operations]
        uses_index: [hive_account_operations_account_id_op_type_id_idx]
      time: {max_ms: 1000, error_threshold: 0.5}

    # JSON-RPC account_history_api.get_ops_in_block: hafah_backend.get_ops_in_block,
    # its rows from hafah_backend.helper_operations_view. ${only_virtual} is
    # _only_virtual, FALSE when the request omits it (call_get_ops_in_block reads
    # only `only_virtual`, so an `onlyvirtual` key is ignored). This declaration
    # maps the block alone, so it covers every request; the -with-only-virtual
    # variant below carries the flag for the requests that send it.
    - &jsonrpc-ops-in-block
      name: jsonrpc-ops-in-block
      sql: |
        SELECT
          ht.trx_hash, ht.trx_in_block, T.op_pos, T.virtual_op, hb.created_at, T.body, T.id
        FROM (
          SELECT ho.id, ho.block_num, ho.trx_in_block, ho.op_pos, ho.body, ho.op_type_id, ho.virtual_op
          FROM hafah_backend.helper_operations_view ho
          WHERE ho.block_num = ${block}
            AND (${only_virtual} = FALSE OR ho.virtual_op = TRUE)
        ) T
        JOIN hafd.blocks hb ON hb.num = T.block_num
        LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = T.block_num AND tx.trx_in_block = T.trx_in_block
          LIMIT 1
        ) ht ON TRUE
        ORDER BY T.id
      parameters:
        # hafd.operations has no block_num column (an operation's block is encoded in its id); transaction density per block stands in for operation density when choosing dense and sparse blocks.
        block: {column: hafd.transactions.block_num, value: 100000000}
        only_virtual: {column: hafd.operation_types.is_virtual, value: false}
      api_methods: [account_history_api.get_ops_in_block]
      parameter_map: {block: params.block_num}
      role:
        frequency: "per get_ops_in_block call — block-following indexers fetch every block"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 200
      plan:
        no_seq_scan: [hafd.operations, hafd.transactions, hafd.blocks]
      time: {max_ms: 200, error_threshold: 0.5}

    # The same statement for a request that sends only_virtual.
    - <<: *jsonrpc-ops-in-block
      name: jsonrpc-ops-in-block-with-only-virtual
      parameter_map: {block: params.block_num, only_virtual: params.only_virtual}

    # condenser_api.get_ops_in_block: the same statement, its params [block_num, only_virtual] by position.
    - <<: *jsonrpc-ops-in-block
      name: condenser-ops-in-block
      api_methods: [condenser_api.get_ops_in_block]
      parameter_map: {block: params.0, only_virtual: params.1}

    # JSON-RPC account_history_api.enum_virtual_ops, no filter, a 100-block
    # window: hafah_backend.enum_virtual_ops. ${block_end} is _block_range_end
    # (exclusive), held to the 2000 blocks validate_block_range lets a request
    # span, so a catalogued start window stays a range a request can ask for;
    # ${limit} is _limit, 150000 when the request omits it.
    - &jsonrpc-enum-virtual-ops
      name: jsonrpc-enum-virtual-ops
      sql: |
        WITH pre_result AS (
          SELECT T2.trx_hash, T.block_num AS _block, T2.trx_in_block, T.op_pos, T.virtual_op, T.body, T.id AS _operation_id
          FROM (
            SELECT ho.id, hafd.operation_id_to_block_num(ho.id) AS block_num, ho.trx_in_block, ho.op_pos::BIGINT AS op_pos,
                   jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
                   ho.op_type_id, hot.is_virtual AS virtual_op
            FROM hafd.operations ho
            JOIN hafd.operation_types hot ON ho.op_type_id = hot.id
            WHERE hafd.operation_id_to_block_num(ho.id) >= ${block}
              AND hafd.operation_id_to_block_num(ho.id) < LEAST(${block_end}, ${block} + 2000)
              AND hot.is_virtual = TRUE
            ORDER BY ho.id
            LIMIT ${limit}
          ) T
          LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = T.block_num AND tx.trx_in_block = T.trx_in_block
          LIMIT 1
        ) T2 ON TRUE
        )
        SELECT pre_result.*, hb.created_at
        FROM pre_result
        JOIN hafd.blocks hb ON hb.num = pre_result._block
        ORDER BY pre_result._operation_id
      parameters:
        block: {column: hafd.transactions.block_num, value: 100000000, range: 100}
        block_end: {column: hafd.transactions.block_num, value: 100000100}
      limit: {param: limit, value: 150000, values: [150000]}
      api_methods: [account_history_api.enum_virtual_ops]
      parameter_map: {block: params.block_range_begin, block_end: params.block_range_end, limit: params.limit}
      role:
        frequency: "per enum_virtual_ops call — reward and payout indexers walking the chain"
        waiter: "JSON-RPC client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.operations, hafd.transactions, hafd.blocks]
        uses_index: [hive_operations_block_num_trx_in_block_idx]  # what the shape chooses (2026-10-12)
      time: {max_ms: 1000, error_threshold: 0.5}

    # condenser_api.enum_virtual_ops: the same statement, its params [block_range_begin, block_range_end, operation_begin, limit] by position.
    - <<: *jsonrpc-enum-virtual-ops
      name: condenser-enum-virtual-ops
      api_methods: [condenser_api.enum_virtual_ops]
      parameter_map: {block: params.0, block_end: params.1, limit: params.3}

    # REST GET /operations?from-block=…&to-block=…: the unfiltered branch of
    # hafah_backend.get_ops_in_blocks_helper. get_ops_in_blocks passes it the
    # inclusive to-block + 1 as its exclusive end, held here to the 2000 blocks
    # get_operations' validate_block_range allows; ${page_size} is _limit.
    - name: rest-operations-in-block-range
      sql: |
        SELECT T.block_num, T2.trx_hash, T2.trx_in_block, T.op_pos, T.op_type_id, T.virtual_op, T.body, T.id
        FROM (
          SELECT ho.id, hafd.operation_id_to_block_num(ho.id) AS block_num, ho.trx_in_block, ho.op_pos::BIGINT AS op_pos,
                 jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body,
                 ho.op_type_id, hot.is_virtual AS virtual_op
          FROM hafd.operations ho
          JOIN hafd.operation_types hot ON ho.op_type_id = hot.id
          WHERE hafd.operation_id_to_block_num(ho.id) >= ${block}
            AND hafd.operation_id_to_block_num(ho.id) < LEAST(${to_block}, ${block} + 2000) + 1
          ORDER BY ho.id
          LIMIT ${page_size}
        ) T
        LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = T.block_num AND tx.trx_in_block = T.trx_in_block
          LIMIT 1
        ) T2 ON TRUE
        ORDER BY T.id
        LIMIT ${page_size}
      parameters:
        block: {column: hafd.transactions.block_num, value: 100000000, range: 10}
        to_block: {column: hafd.transactions.block_num, value: 100000009}
      limit: {param: page_size, value: 1000, values: [1000]}
      api_methods: ["rest:/hafah-api/operations"]
      parameter_map: {block: query.from-block, to_block: query.to-block, page_size: query.page-size}
      role:
        frequency: "per REST operations-range page"
        waiter: "REST client through PostgREST"
        latency_ms: 1000
      plan:
        no_seq_scan: [hafd.operations, hafd.transactions]
        uses_index: [hive_operations_block_num_trx_in_block_idx]  # what the shape chooses (2026-10-12)
      time: {max_ms: 1000, error_threshold: 0.5}

    # JSON-RPC account_history_api.get_transaction and REST
    # GET /transactions/{transaction-id}: the lookup by hash in
    # hafah_backend.get_transaction. The hash is the first transaction of block
    # 100,000,000. The lookup is by its primary key alone, so it reads no
    # (block_num, trx_in_block) index.
    - &transaction-by-hash
      name: transaction-by-hash
      sql: |
        SELECT ht.*
        FROM hafd.transactions ht
        WHERE ht.trx_hash = ('\x' || ltrim(${hash}::TEXT, '\x'))::BYTEA
      parameters:
        hash: {column: hafd.transactions.trx_hash, value: '\xbffb22b2a732237098d6ba1b17b5d5e3d5995be3'}
      api_methods: [account_history_api.get_transaction]
      parameter_map: {hash: params.id}
      role:
        frequency: "per transaction lookup — wallets confirming a broadcast"
        waiter: "JSON-RPC or REST client through PostgREST"
        latency_ms: 50
      plan:
        no_seq_scan: [hafd.transactions]
        uses_index: [pk_hive_transactions]
      time: {max_ms: 50, error_threshold: 0.25}

    # condenser_api.get_transaction: the same statement, its params [id] by position.
    - <<: *transaction-by-hash
      name: condenser-transaction-by-hash
      api_methods: [condenser_api.get_transaction]
      parameter_map: {hash: params.0}

    # REST GET /transactions/{transaction-id}: the same statement, the id its path segment.
    - <<: *transaction-by-hash
      name: rest-transaction-by-hash
      api_methods: ["rest:/hafah-api/transactions/{hash}"]
      parameter_map: {hash: path.3}

    # JSON-RPC get_transaction and REST GET /transactions/{transaction-id}:
    # the transaction's operations, hafah_backend.get_ops_in_transaction.
    - name: operations-in-transaction
      sql: |
        SELECT jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ho.body_value) AS body
        FROM hafd.operations ho
        JOIN hafd.operation_types hot ON ho.op_type_id = hot.id
        WHERE hafd.operation_id_to_block_num(ho.id) = ${block}
          AND ho.trx_in_block = 0
          AND hot.is_virtual = FALSE
        ORDER BY ho.id
      parameters:
        block: {column: hafd.transactions.block_num, value: 100000000}
      role:
        frequency: "per transaction lookup"
        waiter: "JSON-RPC or REST client through PostgREST"
        latency_ms: 50
      plan:
        no_seq_scan: [hafd.operations]
        uses_index: [hive_operations_block_num_trx_in_block_idx]
      time: {max_ms: 50, error_threshold: 0.25}

    # REST GET /operations/{operation-id}: hafah_backend.get_operation. The id is
    # the first operation of block 100,000,000.
    - name: rest-operation-by-id
      sql: |
        SELECT
          jsonb_build_object('type', replace(hot.name, 'hive::protocol::', ''), 'value', ov.body_value) AS body,
          hafd.operation_id_to_block_num(ov.id) AS block_num, encode(ht.trx_hash, 'hex'), ov.op_pos, ov.op_type_id,
          hb.created_at, hot.is_virtual, ov.id, ov.trx_in_block
        FROM hafd.operations ov
        JOIN hafd.operation_types hot ON hot.id = ov.op_type_id
        JOIN hafd.blocks hb ON hb.num = hafd.operation_id_to_block_num(ov.id)
        LEFT JOIN LATERAL (
          SELECT tx.trx_hash, tx.trx_in_block FROM hafd.transactions tx
          WHERE tx.block_num = hafd.operation_id_to_block_num(ov.id) AND tx.trx_in_block = ov.trx_in_block
          LIMIT 1
        ) ht ON TRUE
        WHERE ov.id = hafd.operation_id(${block}, 0)
          AND hafd.operation_id_to_block_num(hafd.operation_id(${block}, 0)) <= 110696250
      parameters:
        block: {column: hafd.transactions.block_num, value: 100000000}
      role:
        frequency: "per REST operation lookup"
        waiter: "REST client through PostgREST"
        latency_ms: 50
      plan:
        no_seq_scan: [hafd.operations, hafd.transactions, hafd.blocks]
        uses_index: [pk_hive_operations]
      time: {max_ms: 50, error_threshold: 0.25}

  # Run-time plan decisions: each tree's decision function is evaluated on the
  # source for every input below, and the branch it picks is judged by that
  # branch query's cost on the shape. Each call reads the account's whole
  # history, [0, its newest operation], as the callers do for a request with no
  # block range. Inputs are correlated combinations chosen by hand so that each
  # decision is exercised on both sides (an account by its id), followed
  # (inputs_from: workload) by the workload's most frequent requests of the
  # methods the branch queries serve, as they name the account and filter.
  decisions:
    # account_history_include_account / _including_accounts: the matches
    # counted by type and transacting account; NULL takes the two-step. HAfAH#77 was
    # 509861 with the one-transfer partner 1398279 walking (the count ignored
    # the partner).
    - name: include-account-rare-matches
      function: hafah_backend.account_rare_op_matches
      file: backend/utilities/paging.sql
      call: >-
        hafah_backend.account_rare_op_matches(string_to_array(${op_type}::TEXT, ',')::INT[], (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END), 0,
        (SELECT ao.account_op_seq_no FROM hafd.account_operations ao WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END) ORDER BY ao.account_op_seq_no DESC LIMIT 1),
        1001, ARRAY[(CASE WHEN ${partner}::TEXT ~ '^[0-9]+$' THEN ${partner}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${partner}::TEXT) END)]::INT[])
      branch_from: "CASE WHEN result IS NULL THEN 'two_step' ELSE 'rare' END"
      branches: {two_step: rest-include-account-two-step, rare: rest-include-account-rare-matches}
      inputs_from: workload
      inputs:
        - {account: 509861, op_type: 2, partner: 1398279}  # one transfer with the partner: rare
        - {account: 509861, op_type: 2, partner: 509861}   # its own transfers: common
        - {account: 509861, op_type: 2, partner: 1342941}  # a near-empty partner (2 operations in all)
        - {account: 105331, op_type: 2, partner: 105331}   # transfers rare for the account
        - {account: 440, op_type: 2, partner: 440}         # blocktrades' own transfers: common
        - {account: 1157375, op_type: 2, partner: 4}       # heavy account, heaviest partner
      files:
        - backend/utilities/paging.sql
        - backend/rest/account_history/include_account.sql
        - backend/rest/account_history/including_accounts.sql

    # JSON-RPC get_account_history with an operation filter: types counted up
    # to account_rare_match_threshold(limit, N); rare reads every match by type
    # and sorts, otherwise the two-step. Until HAF#364 gives uq1 its INCLUDE
    # (op_type_id) the cut-off stays sqrt(limit * N); after it, 492651 and 120951
    # move to the two-step and 770979 (5.4k matches, cut-off 3.3k) with them.
    - name: jsonrpc-account-history-rare-types
      function: hafah_backend.account_op_types_are_rare
      file: backend/utilities/paging.sql
      call: >-
        hafah_backend.account_op_types_are_rare(hafah_backend.translate_get_account_history_filter(hafah_backend.numeric_to_bigint(${filter_low}), hafah_backend.numeric_to_bigint(${filter_high}))::INT[], (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END), 0,
        (SELECT ao.account_op_seq_no FROM hafd.account_operations ao WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END) ORDER BY ao.account_op_seq_no DESC LIMIT 1),
        1000)
      branch_from: "CASE WHEN result THEN 'rare' ELSE 'two_step' END"
      branches: {two_step: jsonrpc-account-history-by-type, rare: jsonrpc-account-history-by-rare-type}
      inputs_from: workload
      inputs:
        - {account: 509861, filter_low: 4, filter_high: 0}   # heaviest account
        - {account: 105331, filter_low: 4, filter_high: 0}   # transfers rare for the account
        - {account: 440, filter_low: 4, filter_high: 0}      # blocktrades: transfers common
        - {account: 770979, filter_low: 4, filter_high: 0}   # heavy hitter the planner underestimates (2.0M true, 145k estimated)
        - {account: 1342941, filter_low: 4, filter_high: 0}  # near-empty account (2 operations)
        - {account: 1475078, filter_low: 4, filter_high: 0}  # 28 transfers in 9.54M operations: rare (the two-step scans 36.6k pages)
        - {account: 492651, filter_low: 4, filter_high: 0}   # 55.5k transfers in 1.20M: two-step under either cut-off
        - {account: 120951, filter_low: 4, filter_high: 0}   # 26.1k transfers in 1.07M: rare under sqrt(limit * N), two-step after HAF#364
      files:
        - backend/utilities/paging.sql
        - backend/jsonrpc/methods/account_history.sql
        - backend/rest/account_history/by_operations.sql

    # account_history_exclude_account / _excluding_accounts: the same type
    # count, which ignores the excluded partner — so a heavy excluded partner
    # can leave few matches while the count still says common.
    - name: exclude-account-rare-types
      function: hafah_backend.account_op_types_are_rare
      file: backend/utilities/paging.sql
      call: >-
        hafah_backend.account_op_types_are_rare(string_to_array(${op_type}::TEXT, ',')::INT[], (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END), 0,
        (SELECT ao.account_op_seq_no FROM hafd.account_operations ao WHERE ao.account_id = (CASE WHEN ${account}::TEXT ~ '^[0-9]+$' THEN ${account}::TEXT::INT ELSE (SELECT a.id FROM hafd.accounts a WHERE a.name = ${account}::TEXT) END) ORDER BY ao.account_op_seq_no DESC LIMIT 1),
        1001)
      branch_from: "CASE WHEN result THEN 'rare' ELSE 'two_step' END"
      branches: {two_step: rest-exclude-account-two-step, rare: rest-exclude-account-rare}
      inputs_from: workload
      inputs:
        - {account: 509861, op_type: 2, partner: 509861}  # heaviest account excluding its heaviest partner, itself
        - {account: 1157375, op_type: 2, partner: 4}      # heavy account excluding the heaviest partner
        - {account: 440, op_type: 2, partner: 440}        # blocktrades' received transfers
        - {account: 105331, op_type: 2, partner: 440}     # transfers rare for the account
        - {account: 1342941, op_type: 2, partner: 440}    # near-empty account
      files:
        - backend/utilities/paging.sql
        - backend/rest/account_history/exclude_account.sql
        - backend/rest/account_history/excluding_accounts.sql
        - backend/rest/account_history/by_operations.sql

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
