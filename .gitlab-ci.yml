# Publish to registry.hive.blog on protected tags only
# Uses pull/retag/push pattern - no rebuild
publish_images:
  extends: .docker_publish_job_template
  variables:
    # Use "" for root image, subpath for others
    # Note: HAfAH project name is case-sensitive but external registry uses lowercase
    PUBLISH_IMAGES: "HAfAH postgrest-rewriter"
    PUBLISH_PROJECT_NAME: "hafah"

# Extract binaries from pre-built testnet image for functional tests
# The test_tools framework needs local hived binaries to spawn test nodes
extract_testnet_binaries:
  extends: .docker_image_builder_job_template
  stage: build
  needs:
    - job: find_haf_testnet_image
      artifacts: true
  variables:
    BINARY_CACHE_PATH: "haf-testnet-binaries"
  script:
    - |
      echo "Extracting binaries from testnet image: ${HAF_TESTNET_UPSTREAM_IMAGE}"
      mkdir -p "${BINARY_CACHE_PATH}"

      # Create a temporary container from the testnet image (override entrypoint to prevent startup)
      CONTAINER_ID=$(docker create --entrypoint /bin/true "${HAF_TESTNET_UPSTREAM_IMAGE}")

      # Copy binaries from the container (binaries are at /home/hived/bin/)
      docker cp "${CONTAINER_ID}:/home/hived/bin/hived" "${BINARY_CACHE_PATH}/hived"
      docker cp "${CONTAINER_ID}:/home/hived/bin/compress_block_log" "${BINARY_CACHE_PATH}/compress_block_log"
      docker cp "${CONTAINER_ID}:/home/hived/bin/get_dev_key" "${BINARY_CACHE_PATH}/get_dev_key"
      docker cp "${CONTAINER_ID}:/home/hived/bin/cli_wallet" "${BINARY_CACHE_PATH}/cli_wallet"

      # Cleanup container
      docker rm "${CONTAINER_ID}"

      echo "Extracted binaries:"
      ls -la "${BINARY_CACHE_PATH}/"
  artifacts:
    paths:
      - haf-testnet-binaries/
    expire_in: 1 day
  tags:
    - public-runner-docker

.haf-instance-with-nfs-fallback: &haf-instance-with-nfs-fallback
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PGCTLTIMEOUT: 600
    PG_ACCESS: "${HAF_DB_ACCESS}"
    DATA_SOURCE: "${HAF_DATA_SOURCE}"
    SHARED_BLOCK_LOG_DIR: "${BLOCK_LOG_SOURCE_DIR_5M}"
    DATA_SOURCE_NFS_PREFIX: "${DATA_CACHE_NFS_PREFIX}"
    DATA_SOURCE_NFS_TYPE: "haf"
    DATA_SOURCE_NFS_KEY: "${HAF_COMMIT}"
  entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      ORIGINAL_SOURCE="${DATA_SOURCE}"
      NFS_PREFIX="${DATA_SOURCE_NFS_PREFIX:-/nfs/ci-cache}"
      NFS_TYPE="${DATA_SOURCE_NFS_TYPE:-haf}"
      NFS_KEY="${DATA_SOURCE_NFS_KEY}"
      if [[ ! -d "${ORIGINAL_SOURCE}/datadir" ]]; then
        NFS_PATH="${NFS_PREFIX}/${NFS_TYPE}/${NFS_KEY}"
        if [[ -d "${NFS_PATH}/datadir" ]]; then
          export DATA_SOURCE="$NFS_PATH"
        fi
      fi
      exec /home/haf_admin/docker_entrypoint.sh "$@"
    - '/bin/bash'
  command: ["--execute-maintenance-script=${HAF_SOURCE_DIR}/scripts/maintenance-scripts/sleep_infinity.sh"]

# Testnet HAF instance - starts with empty database, no pre-existing data required
