stages:
- detect
- build
- test
- publish
- cleanup

variables:
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: none
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  CI_DEBUG_SERVICES: "true"
  # CI base image version
  BUILDER_IMAGE_TAG: ":python-3.12-bookworm"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"

  # Use the same Python base image for pytest compatibility
  PYTEST_RUNTIME_IMAGE_NAME: "${BUILDER_IMAGE_PATH}"
  # Enable PyO3 forward compatibility for Python 3.14 (rpds-py build support)
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

  # Common CI configuration for fetching scripts at runtime
  COMMON_CI_REF: "develop"
  COMMON_CI_URL: "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/${COMMON_CI_REF}"

  REGISTRY: registry.gitlab.syncad.com/hive/hafah
  BLOG_REGISTRY: registry-upload.hive.blog/hafah
  APP_PORT: 6543

  # =============================================================================
  # HAF and Hive Version Configuration (No Submodule Required)
  # =============================================================================
  # Pre-built images are used from GitLab registries instead of building from
  # submodules. Update these commits when upgrading HAF/hive versions.
  #
  # To find the hive commit for a HAF commit:
  #   git -C /path/to/haf ls-tree <haf-commit> hive
  # =============================================================================
  HAF_COMMIT: "a9d236ef60e9551eb98be16a00fca1cb22be4b49"
  HIVE_COMMIT: "1179c5456dbb6be65c73178eb53d2e02223de3a2"

  # Pre-built images from registries (no submodule build required)
  HAF_IMAGE_NAME: "registry.gitlab.syncad.com/hive/haf:${HAF_COMMIT:0:8}"
  HIVED_IMAGE_NAME: "registry.gitlab.syncad.com/hive/hive:${HIVE_COMMIT:0:8}"

  # Allow access from any network to eliminate CI IP addressing problems
  HAF_DB_ACCESS: |
    "host    all              haf_admin        0.0.0.0/0    trust"
    "host    all              hived            0.0.0.0/0    trust"
    "host    all              hafah_user       0.0.0.0/0    trust"
    "host    all              all              0.0.0.0/0    scram-sha-256"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip data preparation and use cached HAF data:
  #
  # 1. AUTOMATIC: When only tests/docs/SQL change, data prep is automatically
  #    skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list below)
  #
  # Find available caches:
  #   ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # Or use: ../haf/scripts/ci-helpers/list-haf-caches.sh --recent
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true - HAF commit with cached data
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only tests/docs/SQL changed

  # Variables specific to runner (there is single runner cache and there is 5m block_log available)
  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  # Cache path format must match NFS structure: /cache/{type}_{key} -> /nfs/ci-cache/{type}/{key}.tar
  # HAF caches are stored at /nfs/ci-cache/haf/{commit}.tar, so use /cache/haf_{commit}
  DATA_CACHE_HAF_PREFIX: "/cache/haf"
  # NFS cache configuration for data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
# Common CI templates from common-ci-configuration
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
    - '/templates/cache_cleanup.gitlab-ci.yml'
    - '/templates/docker_image_jobs.gitlab-ci.yml'
    - '/templates/haf_app_testing.gitlab-ci.yml'
    - '/templates/haf_data_preparation.gitlab-ci.yml'
    - '/templates/python_projects.gitlab-ci.yml'
    - '/templates/npm_projects.gitlab-ci.yml'
    - '/templates/test_jobs.gitlab-ci.yml'

# Use templates from common-ci-configuration for fetch strategy support
default:
  hooks: !reference [.haf_git_corruption_cleanup, hooks]

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/hafah-local-tools"
  tags:
  - public-runner-docker

# =============================================================================
# Data Preparation Jobs (use pre-built images from registry)
# =============================================================================
prepare_hived_data:
  extends: .prepare_hived_data_5m
  stage: build
  variables:
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "/tmp/haf-app-tools/hived_config_5M.ini"
  before_script:
    - !reference [.haf_docker_image_builder_job, before_script]
    - mkdir -p /tmp/haf-app-tools
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/hived_config_5M.ini" -o /tmp/haf-app-tools/hived_config_5M.ini
  tags:
  - data-cache-storage
  - fast

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/postgrest/hafah_REST/hafah_openapi.sql"
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  variables:
    # Override BUILT_JSON_SWAGGER_FILE from dotenv - it contains absolute paths that
    # don't work across different runner slots with GIT_CLONE_PATH
    INPUT_JSON_SWAGGER_FILE: "${CI_PROJECT_DIR}/build/swagger-doc.json"
    NAMESPACE: "hafah"
    API_TYPE: "rest"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-hafah"
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .prepare_haf_data_5m
  stage: build
  variables:
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "/tmp/haf-app-tools/config_5M.ini"
  before_script:
    - !reference [.haf_docker_image_builder_job, before_script]
    - mkdir -p /tmp/haf-app-tools
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/config_5M.ini" -o /tmp/haf-app-tools/config_5M.ini
  tags:
  - data-cache-storage
  - fast

.prepare_hafah_image:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    HAFAH_IMAGE_TAG: ""
    HAFAH_IMAGE_NAME: $CI_REGISTRY_IMAGE:$HAFAH_IMAGE_TAG
    USE_POSTGREST: 0
    SOURCE_DIR: $CI_PROJECT_DIR

  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  # Fetch HAF scripts from common-ci-configuration (replaces submodule)
  - mkdir -p "${CI_PROJECT_DIR}/haf/scripts"
  - |
    for script in common.sh create_haf_app_role.sh; do
      curl -fsSL "${COMMON_CI_URL}/haf-app-tools/scripts/${script}" -o "${CI_PROJECT_DIR}/haf/scripts/${script}"
      chmod +x "${CI_PROJECT_DIR}/haf/scripts/${script}"
    done

  script:
  - |
    echo $HAFAH_IMAGE_NAME
    echo $SOURCE_DIR
    scripts/ci-helpers/build_instance.sh
    docker login -u "$HAFAH_CI_IMG_BUILDER_USER" -p "$HAFAH_CI_IMG_BUILDER_PASSWORD" "$REGISTRY"
    docker push "$HAFAH_IMAGE_NAME"
    docker push "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG"
    echo "HAFAH_IMAGE_NAME=$HAFAH_IMAGE_NAME" > docker_image_name.env
    if [[ -n "$CI_COMMIT_TAG" ]]; then
      docker login -u "$BLOG_REGISTRY_USER" -p "$BLOG_REGISTRY_PASSWORD" "registry-upload.hive.blog"
      docker tag "$HAFAH_IMAGE_NAME" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker tag "$HAFAH_IMAGE_NAME" "registry-upload.hive.blog/hafah:$CI_COMMIT_TAG"
      docker push "registry-upload.hive.blog/hafah:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG" "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
      docker push "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG" "registry-upload.hive.blog/hafah/postgrest-rewriter:$CI_COMMIT_TAG"
      docker push "registry-upload.hive.blog/hafah/postgrest-rewriter:$CI_COMMIT_TAG"
    fi

  artifacts:
    paths:
    - docker_image_name.env
    reports:
      dotenv: docker_image_name.env

  tags:
  - public-runner-docker
  - hived

prepare_postgrest_hafah_image:
  extends: .prepare_hafah_image
  variables:
    HAFAH_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    USE_POSTGREST: 1

build_setup_docker_image:
  extends: .docker_image_builder_job_template
  stage: build
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  # Fetch HAF scripts from common-ci-configuration (replaces submodule)
  - mkdir -p "${CI_PROJECT_DIR}/haf/scripts"
  - |
    for script in common.sh create_haf_app_role.sh; do
      curl -fsSL "${COMMON_CI_URL}/haf-app-tools/scripts/${script}" -o "${CI_PROJECT_DIR}/haf/scripts/${script}"
      chmod +x "${CI_PROJECT_DIR}/haf/scripts/${script}"
    done
  script: scripts/ci-helpers/build_setup_image.sh "$CI_PROJECT_DIR"
  tags:
  - public-runner-docker

.pattern_tests:
  extends: .haf_app_pattern_tests_template
  stage: test
  variables:
    HAF_APP_IMAGE: ""
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"

    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    # Test tools are cloned at runtime - use the cloned path
    POETRY_INSTALL_ROOT_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/hive-local-tools"

    TEST_SUITE: "condenser_api_patterns/get_transaction and not get_transaction_hex
      or account_history_api or condenser_api_patterns/get_account_history or condenser_api_patterns/get_ops_in_block"
    PATTERN_TESTS_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/api_tests/pattern_tests"
    JUNIT_REPORT: "hive-test-tools/tests/python/api_tests/pattern_tests/results.xml"
    DIRECT_CALLS: 0
    HIVED_UID: $HIVED_UID

  # Override services to use haf_admin for wait script (hafah_user doesn't exist until app-setup creates it)
  services:
    - name: ${HAF_IMAGE_NAME}
      alias: haf-instance
      variables:
        PG_ACCESS: "${HAF_DB_ACCESS}"
        DATA_SOURCE: "${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--stop-at-block=5000000"]

    - name: ${HAF_APP_IMAGE}
      alias: app-setup
      variables:
        POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
      command: ["install_app"]
      entrypoint:
        - '/bin/bash'
        - '-c'
        - |
          set -xeuo pipefail
          echo "Attempting to perform application setup..."
          "./docker_entrypoint.sh" "$@"
          echo "Application setup completed, starting to listed app port to satisfy Gitlab health checker..."
          nc -v -l -p $(echo "${HAF_APP_PORT}")
        - '/bin/bash'

    - name: ${HAF_APP_IMAGE}
      alias: app
      command: ["--postgres-url=postgresql://${HAF_APP_USER}@haf-instance/haf_block_log"]
      entrypoint:
      - '/bin/bash'
      - '-c'
      - |
        set -xeuo pipefail
        # since Gitlab services startup order is undefined, we need to wait for app setup completion
        # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
        [ -s "./app/scripts/wait_for_setup_completed.sh" ] && "./app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
        echo "Application setup finished - continue app-service spawn..."
        # pass control to the default image entrypoint
        "./docker_entrypoint.sh" "$@"
      - '/bin/bash'

  needs:
  - job: prepare_haf_data
    artifacts: true

  # Clone hive test tools at runtime (replaces submodule)
  before_script:
    - |
      echo "Cloning hive test tools..."
      git clone --depth 1 --single-branch --branch develop \
        https://gitlab.syncad.com/hive/hive.git "${CI_PROJECT_DIR}/hive-test-tools" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/hive-test-tools"
      git sparse-checkout init --cone
      git sparse-checkout set tests/python
      git checkout
      cd "${CI_PROJECT_DIR}"
    - !reference [.haf_app_pattern_tests_template, before_script]
    - echo "HAfAH image name $HAF_APP_IMAGE"
    - echo "HAF image name $HAF_IMAGE_NAME"

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"
    - "tests/tests_api/hived/workdir_*"
    - "hive-test-tools/tests/python/api_tests/pattern_tests/results.xml"

  tags:
  - data-cache-storage
  - fast

postgrest_pattern_tests:
  extends: .pattern_tests

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME

new_style_postgrest_pattern_tests:
  extends: .pattern_tests

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    # Direct call version does not support condenser_api
    TEST_SUITE: "account_history_api"
    DIRECT_CALLS: 1

.comparison_tests:
  extends: .comparison_tests_template
  stage: test
  variables:
    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    # Test tools are cloned at runtime - use the cloned path
    POETRY_INSTALL_ROOT_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/hive-local-tools"
    COMPARISON_TESTS_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/api_tests/comparsion_tests"
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"
    # HIVED_COMMIT is populated from prepare_hived_data artifacts
    HIVED_UID: $HIVED_UID

  # Clone hive test tools at runtime then do poetry install
  before_script:
    - |
      echo "Cloning hive test tools..."
      git clone --depth 1 --single-branch --branch develop \
        https://gitlab.syncad.com/hive/hive.git "${CI_PROJECT_DIR}/hive-test-tools" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/hive-test-tools"
      git sparse-checkout init --cone
      git sparse-checkout set tests/python
      git checkout
      cd "${CI_PROJECT_DIR}"
    # Poetry install (from .pytest_based_template)
    - python3 -m venv venv/
    - . venv/bin/activate
    - echo "Entering ${POETRY_INSTALL_ROOT_DIR}"
    - cd "${POETRY_INSTALL_ROOT_DIR}"
    - poetry install

  # Override services to use haf_admin for wait script (hafah_user doesn't exist until app-setup creates it)
  # comparison_tests needs services from both hived_pattern_tests_template and haf_app_pattern_tests_template
  services:
    - name: $HIVED_IMAGE_NAME
      alias: hived-instance
      variables:
        DATA_SOURCE: "${DATA_CACHE_HIVE_PREFIX}_${HIVE_COMMIT}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--stop-at-block=5000000"]

    - name: ${HAF_IMAGE_NAME}
      alias: haf-instance
      variables:
        PG_ACCESS: "${HAF_DB_ACCESS}"
        DATA_SOURCE: "${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--stop-at-block=5000000"]

    - name: ${HAF_APP_IMAGE}
      alias: app-setup
      variables:
        POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
      command: ["install_app"]
      entrypoint:
        - '/bin/bash'
        - '-c'
        - |
          set -xeuo pipefail
          echo "Attempting to perform application setup..."
          "./docker_entrypoint.sh" "$@"
          echo "Application setup completed, starting to listed app port to satisfy Gitlab health checker..."
          nc -v -l -p $(echo "${HAF_APP_PORT}")
        - '/bin/bash'

    - name: ${HAF_APP_IMAGE}
      alias: app
      command: ["--postgres-url=postgresql://${HAF_APP_USER}@haf-instance/haf_block_log"]
      entrypoint:
      - '/bin/bash'
      - '-c'
      - |
        set -xeuo pipefail
        # since Gitlab services startup order is undefined, we need to wait for app setup completion
        # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
        [ -s "./app/scripts/wait_for_setup_completed.sh" ] && "./app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
        echo "Application setup finished - continue app-service spawn..."
        # pass control to the default image entrypoint
        "./docker_entrypoint.sh" "$@"
      - '/bin/bash'

  needs:
  - job: prepare_haf_data
    artifacts: true
  - job: prepare_hived_data
    artifacts: true

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"

    reports:
      junit: "hive-test-tools/tests/python/api_tests/comparsion_tests/comparsion_tests.xml"

  tags:
  - data-cache-storage
  - fast

postgrest_comparison_tests:
  extends: .comparison_tests

  needs:
  - !reference [.comparison_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME

.benchmark_tests:
  extends: .jmeter_benchmark_with_haf_job
  stage: test
  variables:
    FF_NETWORK_PER_BUILD: 1
    API_FOR_TESTING: "account_history_api" # alternatively: blocks_api
    HIVED_UID: $HIVED_UID
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: $APP_PORT
    BENCHMARK_SOURCE_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/api_tests/benchmarks"
  needs:
  - job: prepare_haf_data
    artifacts: true
  - job: prepare_postgrest_hafah_image
    artifacts: true

  before_script:
    - |
      echo "Cloning hive test tools for benchmarks..."
      git clone --depth 1 --single-branch --branch develop \
        https://gitlab.syncad.com/hive/hive.git "${CI_PROJECT_DIR}/hive-test-tools" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/hive-test-tools"
      git sparse-checkout init --cone
      git sparse-checkout set tests/python/api_tests/benchmarks
      git checkout
      cd "${CI_PROJECT_DIR}"

  script:
  - /usr/bin/python3 "${BENCHMARK_SOURCE_DIR}/benchmark.py" -a app -p $APP_PORT -c
    perf_5M_heavy.csv -d $CI_PROJECT_DIR/wdir -n $API_FOR_TESTING
  - m2u --input wdir/raw_jmeter_report.xml --output wdir/jmeter_junit_report.xml
  - jmeter -g wdir/jmeter_${APP_PORT}_output.csv -o wdir/dashboard/
  artifacts:
    paths:
    - wdir/
    reports:
      junit: wdir/jmeter_junit_report.xml
  tags:
  - data-cache-storage
  - fast

postgrest_block_api_benchmark_tests:
  extends: .benchmark_tests
  variables:
    API_FOR_TESTING: blocks_api

postgrest_account_history_benchmark_tests:
  extends: .benchmark_tests

postgrest_rest_benchmark_tests:
  extends: .jmeter_benchmark_with_haf_job
  stage: test
  variables:
    FF_NETWORK_PER_BUILD: 1
    HIVED_UID: $HIVED_UID
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: $APP_PORT
  needs:
  - job: prepare_haf_data
    artifacts: true
  - job: prepare_postgrest_hafah_image
    artifacts: true
  script:
  - sleep 10
  - timeout -k 1m 10m ./tests/performance/run_performance_tests.sh --backend-host=app
    --backend-port=$APP_PORT
  - tar -czvf tests/performance/results.tar.gz $(pwd)/tests/performance/*result.*
  - cat jmeter.log | python3 tests/performance/parse-jmeter-output.py
  - m2u --input $(pwd)/tests/performance/result.xml --output $(pwd)/tests/performance/junit-result.xml
  artifacts:
    paths:
    - docker/container-logs.tar.gz
    - tests/performance/result_report/
    - tests/performance/results.tar.gz
    - jmeter.log
    when: always
    reports:
      junit: tests/performance/junit-result.xml
  tags:
  - data-cache-storage
  - fast

cleanup_hive_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_hive_*"
  tags:
  - data-cache-storage
  - fast

cleanup_haf_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_haf_*"
  tags:
  - data-cache-storage
  - fast

build_and_publish_image:
  stage: publish
  extends: .publish_docker_image_template
  before_script:
  - !reference [.publish_docker_image_template, before_script]
  # Fetch HAF scripts from common-ci-configuration (replaces submodule)
  - mkdir -p "${CI_PROJECT_DIR}/haf/scripts"
  - |
    for script in common.sh create_haf_app_role.sh; do
      curl -fsSL "${COMMON_CI_URL}/haf-app-tools/scripts/${script}" -o "${CI_PROJECT_DIR}/haf/scripts/${script}"
      chmod +x "${CI_PROJECT_DIR}/haf/scripts/${script}"
    done
  script:
  - scripts/ci-helpers/build_and_publish_instance.sh
  tags:
  - public-runner-docker
  - hived

prepare_haf_image_testnet:
  extends: .prepare_haf_image
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    REGISTRY_USER: "$CI_IMG_BUILDER_USER"
    REGISTRY_PASS: $CI_IMG_BUILDER_PASSWORD
    HIVE_NETWORK_TYPE: testnet
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-testnet-binaries"
  before_script:
    - !reference [.haf_docker_image_builder_job, before_script]
    # Clone HAF at runtime for testnet build
    - |
      echo "Cloning HAF for testnet build..."
      git clone --depth 1 --single-branch --branch develop \
        --recurse-submodules --shallow-submodules \
        https://gitlab.syncad.com/hive/haf.git "${CI_PROJECT_DIR}/haf"
  tags:
  - public-runner-docker

.haf-instance-with-nfs-fallback: &haf-instance-with-nfs-fallback
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PGCTLTIMEOUT: 600
    PG_ACCESS: |
      "host    all              haf_admin        0.0.0.0/0    trust"
      "host    all              hived            0.0.0.0/0    trust"
      "host    all              hafah_user       0.0.0.0/0    trust"
      "host    all              all              0.0.0.0/0    scram-sha-256"
    DATA_SOURCE: "${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
    DATA_SOURCE_NFS_PREFIX: "${DATA_CACHE_NFS_PREFIX}"
    DATA_SOURCE_NFS_TYPE: "haf"
    DATA_SOURCE_NFS_KEY: "${HAF_COMMIT}"
  entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      ORIGINAL_SOURCE="${DATA_SOURCE}"
      NFS_PREFIX="${DATA_SOURCE_NFS_PREFIX:-/nfs/ci-cache}"
      NFS_TYPE="${DATA_SOURCE_NFS_TYPE:-haf}"
      NFS_KEY="${DATA_SOURCE_NFS_KEY}"
      if [[ ! -d "${ORIGINAL_SOURCE}/datadir" ]]; then
        NFS_PATH="${NFS_PREFIX}/${NFS_TYPE}/${NFS_KEY}"
        if [[ -d "${NFS_PATH}/datadir" ]]; then
          export DATA_SOURCE="$NFS_PATH"
        fi
      fi
      exec /home/haf_admin/docker_entrypoint.sh "$@"
    - '/bin/bash'
  command: ["--execute-maintenance-script=${HAF_SOURCE_DIR}/scripts/maintenance-scripts/sleep_infinity.sh"]

# Testnet HAF instance - starts with empty database, no pre-existing data required
.haf-instance-testnet: &haf-instance-testnet
