stages:
- detect
- build
- test
- publish
- cleanup

variables:
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: none
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  CI_DEBUG_SERVICES: "true"
  # CI base image version (ubuntu24.04-py3.14-2 is the current stable version)
  BUILDER_IMAGE_TAG: ":ubuntu24.04-py3.14-2"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"

  # Python 3.14 image for test tools (wax, test-tools require Python 3.14)
  PYTHON_COMPAT_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:ubuntu24.04-py3.14-2"
  # Use the Python 3.14 image for pytest compatibility
  PYTEST_RUNTIME_IMAGE_NAME: "${PYTHON_COMPAT_IMAGE}"
  # Enable PyO3 forward compatibility for Python 3.14 (rpds-py build support)
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

  # Common CI configuration for fetching scripts at runtime
  COMMON_CI_REF: "develop"
  COMMON_CI_URL: "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/${COMMON_CI_REF}"

  REGISTRY: registry.gitlab.syncad.com/hive/hafah
  BLOG_REGISTRY: registry-upload.hive.blog/hafah
  APP_PORT: 6543

  # =============================================================================
  # Upstream Image Detection (No Submodules Required)
  # =============================================================================
  # Both HAF and Hive images are dynamically detected by find_haf_image and
  # find_hive_image jobs using common-ci-configuration scripts. No manual
  # updates needed - always uses the latest built images from each repo.
  #
  # Output variables (set by detect stage jobs):
  #   HAF_UPSTREAM_IMAGE, HAF_UPSTREAM_COMMIT, HAF_UPSTREAM_TAG
  #   HIVE_UPSTREAM_IMAGE, HIVE_UPSTREAM_COMMIT, HIVE_UPSTREAM_TAG
  # =============================================================================
  # Use develop for test-tools to get latest dependency fixes
  HIVE_TEST_TOOLS_REF: "develop"
  # tests_api repo uses master branch (not develop)
  TESTS_API_REF: "master"

  # Allow access from any network to eliminate CI IP addressing problems
  # Also allow local socket connections for hived/haf_maintainer (peer auth fails in container)
  # IPv6 rules (::/0) required because Docker may resolve hostnames to IPv6 addresses
  HAF_DB_ACCESS: |
    "local   all              haf_admin                     trust"
    "local   all              haf_maintainer                trust"
    "local   all              hived                         trust"
    "local   all              postgres                      trust"
    "host    all              haf_admin        0.0.0.0/0    trust"
    "host    all              haf_admin        ::/0         trust"
    "host    all              hived            0.0.0.0/0    trust"
    "host    all              hived            ::/0         trust"
    "host    all              haf_maintainer   0.0.0.0/0    trust"
    "host    all              haf_maintainer   ::/0         trust"
    "host    all              hafah_user       0.0.0.0/0    trust"
    "host    all              hafah_user       ::/0         trust"
    "host    all              all              0.0.0.0/0    scram-sha-256"
    "host    all              all              ::/0         scram-sha-256"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip data preparation and use cached HAF data:
  #
  # 1. AUTOMATIC: When only tests/docs/SQL change, data prep is automatically
  #    skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list below)
  #
  # Find available caches:
  #   ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # Or use: ../haf/scripts/ci-helpers/list-haf-caches.sh --recent
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true - HAF commit with cached data
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only tests/docs/SQL changed

  # Variables specific to runner (there is single runner cache and there is 5m block_log available)
  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  # Cache path format must match NFS structure: /cache/{type}_{key} -> /nfs/ci-cache/{type}/{key}.tar
  # HAF caches are stored at /nfs/ci-cache/haf/{commit}.tar, so use /cache/haf_{commit}
  DATA_CACHE_HAF_PREFIX: "/cache/haf"
  # NFS cache configuration for data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
# Common CI templates from common-ci-configuration
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
    - '/templates/cache_cleanup.gitlab-ci.yml'
    - '/templates/docker_image_jobs.gitlab-ci.yml'
    - '/templates/haf_app_testing.gitlab-ci.yml'
    - '/templates/haf_data_preparation.gitlab-ci.yml'
    - '/templates/python_projects.gitlab-ci.yml'
    - '/templates/npm_projects.gitlab-ci.yml'
    - '/templates/test_jobs.gitlab-ci.yml'
    - '/templates/source_change_detection.gitlab-ci.yml'

# Use templates from common-ci-configuration for fetch strategy support
default:
  hooks:
    pre_get_sources_script:
      - !reference [.haf_git_corruption_cleanup, hooks, pre_get_sources_script]
      - !reference [.haf_permission_fix, hooks, pre_get_sources_script]

# =============================================================================
# Upstream Image Detection Jobs
# =============================================================================
# Automatically find the latest built images from upstream repos (Hive, HAF) by
# analyzing which commits changed source files. Uses .find_upstream_image template
# from common-ci-configuration.
#
# Each job outputs variables with a unique prefix to avoid collisions:
#   find_hive_image → HIVE_UPSTREAM_* (HIVE_UPSTREAM_IMAGE, HIVE_UPSTREAM_COMMIT, etc.)
#   find_haf_image  → HAF_UPSTREAM_*  (HAF_UPSTREAM_IMAGE, HAF_UPSTREAM_COMMIT, etc.)
# =============================================================================
find_hive_image:
  extends: .find_upstream_image
  stage: detect
  variables:
    UPSTREAM_REPO_URL: "https://gitlab.syncad.com/hive/hive.git"
    UPSTREAM_REGISTRY: "registry.gitlab.syncad.com/hive/hive"
    UPSTREAM_BRANCH: "develop"
    UPSTREAM_OUTPUT: "hive_image.env"
  before_script:
    # docker-builder image already has git, bash, and curl
    # Fetch source patterns from hive's script (single source of truth)
    - |
      PATTERNS_URL="https://gitlab.syncad.com/hive/hive/-/raw/develop/scripts/ci-helpers/source-patterns.sh"
      echo "Fetching source patterns from: $PATTERNS_URL"
      if UPSTREAM_PATTERNS=$(curl -sf "$PATTERNS_URL" | sh); then
        echo "Loaded patterns: $UPSTREAM_PATTERNS"
        export UPSTREAM_PATTERNS
      else
        echo "ERROR: Could not fetch source-patterns.sh from hive"
        exit 1
      fi
  script:
    - !reference [.find_upstream_image, script]
    # Rename UPSTREAM_* to HIVE_UPSTREAM_* to avoid collisions with other upstream jobs
    - |
      if [ -f "$UPSTREAM_OUTPUT" ]; then
        sed -i 's/^UPSTREAM_/HIVE_UPSTREAM_/' "$UPSTREAM_OUTPUT"
        echo "Renamed variables in $UPSTREAM_OUTPUT:"
        cat "$UPSTREAM_OUTPUT"
      fi
  artifacts:
    reports:
      dotenv: hive_image.env
    expire_in: 1 day
  tags:
    - public-runner-docker

find_haf_image:
  extends: .find_haf_image
  stage: detect

find_haf_testnet_image:
  extends: .find_haf_image
  stage: detect
  variables:
    HAF_IMAGE_TYPE: "testnet"
    HAF_VAR_PREFIX: "HAF_TESTNET"
  artifacts:
    reports:
      dotenv: haf_testnet_image.env
    expire_in: 1 day

# =============================================================================
# Reusable YAML Anchors for Services and Clone Operations
# =============================================================================
# These anchors reduce duplication across benchmark and test jobs.

# HAF instance service for benchmark tests (simple, no NFS fallback)
.haf-instance-benchmark: &haf-instance-benchmark
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PG_ACCESS: "${HAF_DB_ACCESS}"
    DATA_SOURCE: "${HAF_DATA_SOURCE}"
    SHARED_BLOCK_LOG_DIR: "${BLOCK_LOG_SOURCE_DIR_5M}"
    LOG_FILE: $CI_JOB_NAME.log
  command: ["--stop-at-block=5000000"]

# HAfAH app-setup service (installs app then listens for health check)
.hafah-app-setup: &hafah-app-setup
  name: ${HAF_APP_IMAGE}
  alias: app-setup
  variables:
    POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
  command: ["install_app"]
  entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      echo "Attempting to perform application setup..."
      "./docker_entrypoint.sh" "$@"
      echo "Application setup completed, starting to listen on app port to satisfy Gitlab health checker..."
      nc -v -l -p $(echo "${HAF_APP_PORT}")
    - '/bin/bash'

# HAfAH app service (waits for setup, then starts PostgREST)
.hafah-app-service: &hafah-app-service
  name: ${HAF_APP_IMAGE}
  alias: app
  command: ["--postgres-url=postgresql://${HAF_APP_USER}@haf-instance/haf_block_log"]
  entrypoint:
  - '/bin/bash'
  - '-c'
  - |
    set -xeuo pipefail
    # Since Gitlab services startup order is undefined, wait for app setup completion
    # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
    [ -s "./app/scripts/wait_for_setup_completed.sh" ] && "./app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
    echo "Application setup finished - continue app-service spawn..."
    # Pass control to the default image entrypoint
    "./docker_entrypoint.sh" "$@"
  - '/bin/bash'

# Clone hive test-tools (tests/python directory with submodules)
# Usage: !reference [.clone_hive_test_tools, script]
.clone_hive_test_tools:
  script:
    - |
      echo "Cloning hive test tools at ref ${HIVE_TEST_TOOLS_REF}..."
      git clone --depth 1 --single-branch \
        https://gitlab.syncad.com/hive/hive.git "${CI_PROJECT_DIR}/hive-test-tools" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/hive-test-tools"
      git fetch --depth 1 origin "${HIVE_TEST_TOOLS_REF}"
      git sparse-checkout init --cone
      git sparse-checkout set tests/python
      git checkout "${HIVE_TEST_TOOLS_REF}"
      # Initialize submodules within hive-local-tools (test-tools, tests_api, shared-tools)
      git submodule update --init --depth 1 tests/python/hive-local-tools/test-tools
      git submodule update --init --depth 1 tests/python/hive-local-tools/tests_api
      git submodule update --init --depth 1 tests/python/hive-local-tools/shared-tools
      cd "${CI_PROJECT_DIR}"

# Clone tests_api repo for benchmarks (uses TESTS_API_REF - master branch)
# Usage: !reference [.clone_tests_api, script]
.clone_tests_api:
  script:
    - |
      echo "Cloning tests_api repo for benchmarks at ref ${TESTS_API_REF}..."
      git clone --depth 1 --single-branch -b "${TESTS_API_REF}" \
        https://gitlab.syncad.com/hive/tests_api.git "${CI_PROJECT_DIR}/tests_api"

# Clone HAF and hive test tools for pytest functional tests
# This creates haf/ and haf/hive/ directories for hafah-local-tools path dependencies
# Usage: !reference [.clone_haf_and_hive_test_tools, script]
.clone_haf_and_hive_test_tools:
  script:
    - |
      echo "Cloning HAF test tools at commit ${HAF_COMMIT}..."
      git clone --depth 1 --single-branch \
        https://gitlab.syncad.com/hive/haf.git "${CI_PROJECT_DIR}/haf" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/haf"
      git fetch --depth 1 origin "${HAF_COMMIT}"
      git sparse-checkout init --cone
      git sparse-checkout set tests/integration/haf-local-tools
      git checkout "${HAF_COMMIT}"
      cd "${CI_PROJECT_DIR}"
    - |
      echo "Cloning hive test tools into haf/hive at ref ${HIVE_TEST_TOOLS_REF}..."
      git clone --depth 1 --single-branch \
        https://gitlab.syncad.com/hive/hive.git "${CI_PROJECT_DIR}/haf/hive" \
        --no-checkout
      cd "${CI_PROJECT_DIR}/haf/hive"
      git fetch --depth 1 origin "${HIVE_TEST_TOOLS_REF}"
      git sparse-checkout init --cone
      git sparse-checkout set tests/python/hive-local-tools
      git checkout "${HIVE_TEST_TOOLS_REF}"
      # Initialize submodules within hive-local-tools
      git submodule update --init --depth 1 tests/python/hive-local-tools/test-tools
      git submodule update --init --depth 1 tests/python/hive-local-tools/tests_api
      git submodule update --init --depth 1 tests/python/hive-local-tools/shared-tools
      cd "${CI_PROJECT_DIR}"

# =============================================================================
# Validation Jobs
# =============================================================================
# Note: Both HAF and Hive variables are automatically detected by find_haf_image
# and find_hive_image jobs. No manual validation needed.

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/hafah-local-tools"
  tags:
  - public-runner-docker

# =============================================================================
# Data Preparation Jobs (use pre-built images from registry)
# =============================================================================
prepare_hived_data:
  extends: .prepare_hived_data_5m
  stage: build
  needs:
    - job: find_hive_image
      artifacts: true
  variables:
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "/tmp/haf-app-tools/hived_config_5M.ini"
    # Map HIVE_UPSTREAM_* from find_hive_image to HIVE_* expected by template
    HIVED_IMAGE_NAME: "${HIVE_UPSTREAM_IMAGE}"
    HIVE_COMMIT: "${HIVE_UPSTREAM_COMMIT}"
  before_script:
    - !reference [.haf_docker_image_builder_job, before_script]
    - mkdir -p /tmp/haf-app-tools
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/hived_config_5M.ini" -o /tmp/haf-app-tools/hived_config_5M.ini
    # Log the mapped variables
    - echo "Using hived image:${HIVED_IMAGE_NAME} (commit:${HIVE_COMMIT})"
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/postgrest/hafah_REST/hafah_openapi.sql"
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  variables:
    # Override BUILT_JSON_SWAGGER_FILE from dotenv - it contains absolute paths that
    # don't work across different runner slots with GIT_CLONE_PATH
    INPUT_JSON_SWAGGER_FILE: "${CI_PROJECT_DIR}/build/swagger-doc.json"
    NAMESPACE: "hafah"
    API_TYPE: "rest"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-hafah"
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .haf_app_prepare_data_with_find
  stage: build
  variables:
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "/tmp/haf-app-tools/config_5M.ini"
    # Map HAF_UPSTREAM_* from find_haf_image to HAF_* expected by template
    HAF_IMAGE_NAME: "${HAF_UPSTREAM_IMAGE}"
    HAF_COMMIT: "${HAF_UPSTREAM_COMMIT}"
  before_script:
    - !reference [.haf_docker_image_builder_job, before_script]
    - mkdir -p /tmp/haf-app-tools
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/config_5M.ini" -o /tmp/haf-app-tools/config_5M.ini
    # Log the mapped variables
    - echo "Using HAF image:${HAF_IMAGE_NAME} (commit:${HAF_COMMIT})"
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

.prepare_hafah_image:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    HAFAH_IMAGE_TAG: ""
    HAFAH_IMAGE_NAME: $CI_REGISTRY_IMAGE:$HAFAH_IMAGE_TAG
    USE_POSTGREST: 0
    SOURCE_DIR: $CI_PROJECT_DIR

  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  # Fetch HAF scripts from common-ci-configuration (replaces submodule)
  - mkdir -p "${CI_PROJECT_DIR}/haf/scripts"
  - |
    for script in common.sh create_haf_app_role.sh; do
      curl -fsSL "${COMMON_CI_URL}/haf-app-tools/scripts/${script}" -o "${CI_PROJECT_DIR}/haf/scripts/${script}"
      chmod +x "${CI_PROJECT_DIR}/haf/scripts/${script}"
    done

  script:
  - |
    echo "Building HAfAH image: $HAFAH_IMAGE_NAME"
    docker login -u "$HAFAH_CI_IMG_BUILDER_USER" -p "$HAFAH_CI_IMG_BUILDER_PASSWORD" "$REGISTRY"
    # build_instance.sh handles tagging (short SHA, latest on develop, version on protected tags)
    # and pushes directly to registry
    scripts/ci-helpers/build_instance.sh "$HAFAH_IMAGE_TAG" "$SOURCE_DIR" "$CI_REGISTRY_IMAGE"
    echo "HAFAH_IMAGE_NAME=$HAFAH_IMAGE_NAME" > docker_image_name.env

  artifacts:
    paths:
    - docker_image_name.env
    reports:
      dotenv: docker_image_name.env

  tags:
  - public-runner-docker

prepare_postgrest_hafah_image:
  extends: .prepare_hafah_image
  variables:
    HAFAH_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    USE_POSTGREST: 1

.pattern_tests:
  extends: .haf_app_pattern_tests_template
  stage: test
  variables:
    # Map HAF_UPSTREAM_* from find_haf_image to HAF_* expected by template
    HAF_IMAGE_NAME: "${HAF_UPSTREAM_IMAGE}"
    HAF_DATA_SOURCE: "/cache/haf_${HAF_UPSTREAM_COMMIT}"
    HAF_APP_IMAGE: "${HAFAH_IMAGE_NAME}"
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"

    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    # Test tools are cloned at runtime - use the cloned path
    POETRY_INSTALL_ROOT_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/hive-local-tools"

    TEST_SUITE: "condenser_api_patterns/get_transaction and not get_transaction_hex
      or account_history_api or condenser_api_patterns/get_account_history or condenser_api_patterns/get_ops_in_block"
    PATTERN_TESTS_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/api_tests/pattern_tests"
    JUNIT_REPORT: "hive-test-tools/tests/python/api_tests/pattern_tests/results.xml"
    DIRECT_CALLS: 0
    HIVED_UID: $HIVED_UID

  # Override services to use haf_admin for wait script (hafah_user doesn't exist until app-setup creates it)
  services:
    - name: ${HAF_IMAGE_NAME}
      alias: haf-instance
      variables:
        PG_ACCESS: "${HAF_DB_ACCESS}"
        DATA_SOURCE: "${HAF_DATA_SOURCE}"
        SHARED_BLOCK_LOG_DIR: "${BLOCK_LOG_SOURCE_DIR_5M}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--stop-at-block=5000000"]

    - name: ${HAF_APP_IMAGE}
      alias: app-setup
      variables:
        POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
      command: ["install_app"]
      entrypoint:
        - '/bin/bash'
        - '-c'
        - |
          set -xeuo pipefail
          echo "Attempting to perform application setup..."
          "./docker_entrypoint.sh" "$@"
          echo "Application setup completed, starting to listen on app port to satisfy Gitlab health checker..."
          nc -v -l -p $(echo "${HAF_APP_PORT}")
        - '/bin/bash'

    - name: ${HAF_APP_IMAGE}
      alias: app
      command: ["--postgres-url=postgresql://${HAF_APP_USER}@haf-instance/haf_block_log"]
      entrypoint:
      - '/bin/bash'
      - '-c'
      - |
        set -xeuo pipefail
        # since Gitlab services startup order is undefined, we need to wait for app setup completion
        # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
        [ -s "./app/scripts/wait_for_setup_completed.sh" ] && "./app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
        echo "Application setup finished - continue app-service spawn..."
        # pass control to the default image entrypoint
        "./docker_entrypoint.sh" "$@"
      - '/bin/bash'

  needs:
  - job: find_haf_image
    artifacts: true
  - job: prepare_haf_data
    artifacts: true

  # Clone hive test tools at runtime (replaces submodule)
  before_script:
    - !reference [.clone_hive_test_tools, script]
    - !reference [.haf_app_pattern_tests_template, before_script]
    - echo "HAfAH image name $HAF_APP_IMAGE"
    - echo "HAF image name $HAF_IMAGE_NAME"

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"
    - "tests/tests_api/hived/workdir_*"
    - "hive-test-tools/tests/python/api_tests/pattern_tests/results.xml"

  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

postgrest_pattern_tests:
  extends: .pattern_tests

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME

new_style_postgrest_pattern_tests:
  extends: .pattern_tests

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    # Direct call version does not support condenser_api
    TEST_SUITE: "account_history_api"
    DIRECT_CALLS: 1

.comparison_tests:
  extends: .comparison_tests_template
  stage: test
  variables:
    # Map HAF_UPSTREAM_* from find_haf_image to HAF_* expected by template
    HAF_IMAGE_NAME: "${HAF_UPSTREAM_IMAGE}"
    HAF_DATA_SOURCE: "/cache/haf_${HAF_UPSTREAM_COMMIT}"
    HAF_APP_IMAGE: "${HAFAH_IMAGE_NAME}"
    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    # Test tools are cloned at runtime - use the cloned path
    POETRY_INSTALL_ROOT_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/hive-local-tools"
    COMPARISON_TESTS_DIR: "${CI_PROJECT_DIR}/hive-test-tools/tests/python/api_tests/comparsion_tests"
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"
    HIVED_UID: $HIVED_UID
    # Map HIVE_UPSTREAM_* from find_hive_image to HIVE_* for services
    HIVED_IMAGE_NAME: "${HIVE_UPSTREAM_IMAGE}"
    HIVE_DATA_SOURCE: "${DATA_CACHE_HIVE_PREFIX}_${HIVE_UPSTREAM_COMMIT}"

  # Clone hive test tools at runtime then do poetry install
  before_script:
    - !reference [.clone_hive_test_tools, script]
    # Poetry install (from .pytest_based_template)
    - python3 -m venv venv/
    - . venv/bin/activate
    - echo "Entering ${POETRY_INSTALL_ROOT_DIR}"
    - cd "${POETRY_INSTALL_ROOT_DIR}"
    - poetry install

  # Override services to use haf_admin for wait script (hafah_user doesn't exist until app-setup creates it)
  # comparison_tests needs services from both hived_pattern_tests_template and haf_app_pattern_tests_template
  services:
    - name: $HIVED_IMAGE_NAME
      alias: hived-instance
      variables:
        DATA_SOURCE: "${HIVE_DATA_SOURCE}"
        SHARED_BLOCK_LOG_DIR: "${BLOCK_LOG_SOURCE_DIR_5M}"
        LOG_FILE: $CI_JOB_NAME.log
      entrypoint:
        - '/bin/bash'
        - '-c'
        - |
          set -xeuo pipefail
          # Download fixed copy_datadir.sh from develop until hive images are rebuilt
          # Use wget (Alpine) or curl (Debian) based on availability
          if command -v wget >/dev/null 2>&1; then
            wget -qO /home/hived_admin/scripts/copy_datadir.sh "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/haf-app-tools/scripts/copy_datadir.sh"
          elif command -v curl >/dev/null 2>&1; then
            curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/haf-app-tools/scripts/copy_datadir.sh" -o /home/hived_admin/scripts/copy_datadir.sh
          else
            echo "WARNING: Neither wget nor curl available, using bundled copy_datadir.sh"
          fi
          chmod +x /home/hived_admin/scripts/copy_datadir.sh
          # Run the original docker entrypoint with the fixed copy_datadir.sh
          exec /home/hived_admin/docker_entrypoint.sh --stop-at-block=5000000

    - name: ${HAF_IMAGE_NAME}
      alias: haf-instance
      variables:
        PG_ACCESS: "${HAF_DB_ACCESS}"
        DATA_SOURCE: "${HAF_DATA_SOURCE}"
        SHARED_BLOCK_LOG_DIR: "${BLOCK_LOG_SOURCE_DIR_5M}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--stop-at-block=5000000"]

    - name: ${HAF_APP_IMAGE}
      alias: app-setup
      variables:
        POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
      command: ["install_app"]
      entrypoint:
        - '/bin/bash'
        - '-c'
        - |
          set -xeuo pipefail
          echo "Attempting to perform application setup..."
          "./docker_entrypoint.sh" "$@"
          echo "Application setup completed, starting to listen on app port to satisfy Gitlab health checker..."
          nc -v -l -p $(echo "${HAF_APP_PORT}")
        - '/bin/bash'

    - name: ${HAF_APP_IMAGE}
      alias: app
      command: ["--postgres-url=postgresql://${HAF_APP_USER}@haf-instance/haf_block_log"]
      entrypoint:
      - '/bin/bash'
      - '-c'
      - |
        set -xeuo pipefail
        # since Gitlab services startup order is undefined, we need to wait for app setup completion
        # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
        [ -s "./app/scripts/wait_for_setup_completed.sh" ] && "./app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
        echo "Application setup finished - continue app-service spawn..."
        # pass control to the default image entrypoint
        "./docker_entrypoint.sh" "$@"
      - '/bin/bash'

  needs:
  - job: find_hive_image
    artifacts: true
  - job: find_haf_image
    artifacts: true
  - job: prepare_haf_data
    artifacts: true
  - job: prepare_hived_data
    artifacts: true

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"

    reports:
      junit: "hive-test-tools/tests/python/api_tests/comparsion_tests/comparsion_tests.xml"

