stages:
- detect
- build
- test
- publish
- cleanup

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: "recursive"
  GIT_DEPTH: 1
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 4

  CI_DEBUG_SERVICES: "true"
  # uses registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:ubuntu24.04-py3.14-1
  BUILDER_IMAGE_TAG: "$TEST_HAF_IMAGE_TAG"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"

  # Python 3.14 compatible runtime image for pytest
  PYTEST_RUNTIME_IMAGE_NAME: "${BUILDER_IMAGE_PATH}"
  POETRY_INSTALL_DIR: "${CI_PROJECT_DIR}/haf/hive/tests/python/hive-local-tools"

  SETUP_SCRIPTS_PATH: "$CI_PROJECT_DIR/haf/scripts"
  REGISTRY: registry.gitlab.syncad.com/hive/hafah
  BLOG_REGISTRY: registry-upload.hive.blog/hafah
  APP_PORT: 6543
  BENCHMARK_SOURCE_DIR: "$CI_PROJECT_DIR/haf/hive/tests/python/hive-local-tools/tests_api/benchmarks"

  # Allow access from any network to eliminate CI IP addressing problems
  HAF_DB_ACCESS: |
    "host    all              haf_admin        0.0.0.0/0    trust"
    "host    all              hived            0.0.0.0/0    trust"
    "host    all              hafah_user       0.0.0.0/0    trust"
    "host    all              all              0.0.0.0/0    scram-sha-256"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip data preparation and use cached HAF data:
  #
  # 1. AUTOMATIC: When only tests/docs/SQL change, data prep is automatically
  #    skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list below)
  #
  # Find available caches:
  #   ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # Or use: ../haf/scripts/ci-helpers/list-haf-caches.sh --recent
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true - HAF commit with cached data
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only tests/docs/SQL changed

  # Variables specific to runner (there is single runner cache and there is 5m block_log available)
  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  # HAF submodule commit - must match the 'ref:' in the include section below
  # This is needed for service containers which can't access dotenv artifacts
  HAF_COMMIT: "7559639514d53f8b7e644a61fb2172468427abf9"
  # Enable CI-specific PostgreSQL config with reduced memory for HAF service containers
  HAF_CI_MODE: "1"

  # Python 3.14 compatibility - allow PyO3-based packages to build
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/haf'
  ref: 7559639514d53f8b7e644a61fb2172468427abf9   # develop (Python 3.14)
  file: '/scripts/ci-helpers/prepare_data_image_job.yml'
  # Do not include common-ci-configuration here, it is already referenced by scripts/ci-helpers/prepare_data_image_job.yml included from Haf/Hive repos

# =============================================================================
# Detect Changes - determines if we can skip data preparation
# Outputs via dotenv artifact:
#   AUTO_SKIP_BUILD  - true if data prep can be skipped
#   HAF_COMMIT       - commit SHA for cached data (when skipping)
#
# Note: Actual cache handling is done by cache-manager.sh from common-ci-configuration
# =============================================================================
detect_changes:
  stage: detect
  image: alpine:latest
  rules:
    # Skip for tags (always do full build for releases)
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - |
      set -e
      apk add --no-cache git

      # Initialize defaults
      CAN_SKIP_BUILD=false
      CACHE_COMMIT=""

      # Handle manual QUICK_TEST mode
      if [ "$QUICK_TEST" = "true" ]; then
        echo "=== Manual QUICK_TEST Mode ==="
        CAN_SKIP_BUILD=true
        CACHE_COMMIT="${QUICK_TEST_HAF_COMMIT}"
        if [ -z "$CACHE_COMMIT" ]; then
          echo "ERROR: QUICK_TEST_HAF_COMMIT must be set when QUICK_TEST=true"
          echo ""
          echo "Find available caches:"
          echo "  ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'"
          exit 1
        fi
        echo "Using cached data from: $CACHE_COMMIT"
      else
        # Automatic detection mode
        echo "=== Detecting Changed Files ==="

        # Get changed files - use git show for shallow clones (CI default)
        CHANGED_FILES=$(git show --name-only --pretty=format: HEAD 2>/dev/null | grep -v '^$' || true)

        # Fallback for MR pipelines
        if [ -z "$CHANGED_FILES" ] && [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          echo "MR pipeline: comparing against target branch"
          CHANGED_FILES=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD 2>/dev/null || true)
        fi

        # Last resort: require full build
        if [ -z "$CHANGED_FILES" ]; then
          echo "WARNING: Could not determine changed files - requiring full build"
          CHANGED_FILES="unknown-changes"
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES" | head -50

        # Skip patterns: tests, docs, SQL, markdown
        SKIP_PATTERNS="^tests/|^docs/|\.sql$|\.md$|^README|^CHANGELOG|^LICENSE|^CLAUDE"

        NEEDS_BUILD=$(echo "$CHANGED_FILES" | grep -vE "$SKIP_PATTERNS" || true)

        if [ -z "$NEEDS_BUILD" ]; then
          echo ""
          echo "=== Can skip data prep (only tests/docs/SQL changed) ==="
          CAN_SKIP_BUILD=true

          # Find most recent cache from NFS - cache-manager will handle the rest
          NFS_CACHE_PATH="/nfs/ci-cache/haf"
          if [ -d "$NFS_CACHE_PATH" ]; then
            CACHE_COMMIT=$(ls -t "$NFS_CACHE_PATH"/*.tar 2>/dev/null | head -1 | xargs -r basename | sed 's/\.tar$//' || true)
            if [ -n "$CACHE_COMMIT" ]; then
              echo "Using most recent cache: $CACHE_COMMIT"
            else
              echo "WARNING: No cached data found - cannot skip"
              CAN_SKIP_BUILD=false
            fi
          else
            echo "WARNING: NFS cache path not found - cannot skip"
            CAN_SKIP_BUILD=false
          fi
        else
          echo ""
          echo "=== Full data prep required ==="
          echo "Files requiring data prep:"
          echo "$NEEDS_BUILD" | head -20
        fi
      fi

      # Export results
      echo "AUTO_SKIP_BUILD=$CAN_SKIP_BUILD" >> detect_changes.env
      if [ "$CAN_SKIP_BUILD" = "true" ] && [ -n "$CACHE_COMMIT" ]; then
        echo "HAF_COMMIT=$CACHE_COMMIT" >> detect_changes.env
      fi

      echo ""
      echo "=== Results ==="
      cat detect_changes.env
  artifacts:
    reports:
      dotenv: detect_changes.env
    expire_in: 1 day
  tags:
    - data-cache-storage  # Needs NFS access to find caches

validate_haf_commit:
  stage: build
  image: alpine:latest
  script:
  - |
    set -e
    apk add --no-cache git
    SUBMODULE_COMMIT=$(cat .git/modules/haf/HEAD 2>/dev/null || git -C haf rev-parse HEAD)
    INCLUDE_REF=$(grep -A2 "project:.*hive/haf" .gitlab-ci.yml | grep "ref:" | head -1 | sed 's/.*ref: *\([a-f0-9]*\).*/\1/' || true)
    echo "HAF_COMMIT variable: $HAF_COMMIT"
    echo "HAF submodule HEAD:  $SUBMODULE_COMMIT"
    echo "Include ref:         $INCLUDE_REF"
    ERRORS=0
    if [ "$HAF_COMMIT" != "$SUBMODULE_COMMIT" ]; then
      echo "ERROR: HAF_COMMIT variable does not match submodule commit!"
      ERRORS=1
    fi
    if [ "$HAF_COMMIT" != "$INCLUDE_REF" ]; then
      echo "ERROR: HAF_COMMIT variable does not match include ref!"
      ERRORS=1
    fi
    if [ $ERRORS -eq 1 ]; then
      exit 1
    fi
    echo "All HAF commit references are consistent"
  tags:
  - public-runner-docker

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/hafah-local-tools"
  tags:
  - public-runner-docker

prepare_hived_image:
  extends: .prepare_hived_image
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf/hive"
    REGISTRY_USER: "$HIVED_CI_IMGBUILDER_USER"
    REGISTRY_PASS: $HIVED_CI_IMGBUILDER_PASSWORD
  tags:
  - public-runner-docker

prepare_hived_data:
  extends: .prepare_hived_data_5m
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_hived_image
    artifacts: true
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf/hive"
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/haf/hive/docker/config_5M.ini"
  rules:
  - if: $QUICK_TEST == "true" || $AUTO_SKIP_BUILD == "true"
    when: never
  - when: on_success
  tags:
  - data-cache-storage
  - fast

prepare_haf_image:
  extends: .prepare_haf_image
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    REGISTRY_USER: "$CI_IMG_BUILDER_USER"
    REGISTRY_PASS: $CI_IMG_BUILDER_PASSWORD
  tags:
  - public-runner-docker

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/postgrest/hafah_REST/hafah_openapi.sql"
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  variables:
    INPUT_JSON_SWAGGER_FILE: "${CI_PROJECT_DIR}/build/swagger-doc.json"
    NAMESPACE: "hafah"
    API_TYPE: "rest"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-hafah"
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .prepare_haf_data_5m
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_image
    artifacts: true
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/haf/docker/config_5M.ini"
  rules:
  - if: $QUICK_TEST == "true" || $AUTO_SKIP_BUILD == "true"
    when: never
  - when: on_success
  tags:
  - data-cache-storage
  - fast

.prepare_hafah_image:
  extends: .docker_image_builder_job
  stage: build
  variables:
    HAFAH_IMAGE_TAG: ""
    HAFAH_IMAGE_NAME: $CI_REGISTRY_IMAGE:$HAFAH_IMAGE_TAG
    USE_POSTGREST: 0
    SOURCE_DIR: $CI_PROJECT_DIR
    GIT_STRATEGY: "clone"

  script:
  - |
    echo $HAFAH_IMAGE_NAME
    echo $SOURCE_DIR
    scripts/ci-helpers/build_instance.sh
    docker login -u "$HAFAH_CI_IMG_BUILDER_USER" -p "$HAFAH_CI_IMG_BUILDER_PASSWORD" "$REGISTRY"
    docker push "$HAFAH_IMAGE_NAME"
    docker push "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG"
    echo "HAFAH_IMAGE_NAME=$HAFAH_IMAGE_NAME" > docker_image_name.env
    if [[ -n "$CI_COMMIT_TAG" ]]; then
      docker login -u "$BLOG_REGISTRY_USER" -p "$BLOG_REGISTRY_PASSWORD" "registry-upload.hive.blog"
      docker tag "$HAFAH_IMAGE_NAME" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker tag "$HAFAH_IMAGE_NAME" "registry-upload.hive.blog/hafah:$CI_COMMIT_TAG"
      docker push "registry-upload.hive.blog/hafah:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG" "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
      docker push "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
      docker tag "$CI_REGISTRY_IMAGE/postgrest-rewriter:$HAFAH_IMAGE_TAG" "registry-upload.hive.blog/hafah/postgrest-rewriter:$CI_COMMIT_TAG"
      docker push "registry-upload.hive.blog/hafah/postgrest-rewriter:$CI_COMMIT_TAG"
    fi

  artifacts:
    paths:
    - docker_image_name.env
    reports:
      dotenv: docker_image_name.env

  tags:
  - public-runner-docker

prepare_postgrest_hafah_image:
  extends: .prepare_hafah_image
  variables:
    HAFAH_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    USE_POSTGREST: 1

build_setup_docker_image:
  extends: .docker_image_builder_job
  stage: build
  before_script:
  - !reference [.docker_image_builder_job, before_script]
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script: scripts/ci-helpers/build_setup_image.sh "$CI_PROJECT_DIR"
  tags:
  - public-runner-docker

.pattern_tests:
  extends: .haf_app_pattern_tests_template
  stage: test
  variables:
    HAF_APP_IMAGE: ""
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"

    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    POETRY_INSTALL_ROOT_DIR: ${POETRY_INSTALL_DIR}

    TEST_SUITE: "condenser_api_patterns/get_transaction and not get_transaction_hex
      or account_history_api or condenser_api_patterns/get_account_history or condenser_api_patterns/get_ops_in_block"
    PATTERN_TESTS_DIR: "${CI_PROJECT_DIR}/haf/hive/tests/python/api_tests/pattern_tests"
    JUNIT_REPORT: "haf/hive/tests/python/api_tests/pattern_tests/results.xml"
    DIRECT_CALLS: 0
    HIVED_UID: $HIVED_UID

  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_data
    artifacts: true
    optional: true

  before_script:
  - !reference [.haf_app_pattern_tests_template, before_script]
  - echo "HAfAH image name $HAF_APP_IMAGE"
  - echo "HAF image name $HAF_IMAGE_NAME"

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"
    - "tests/tests_api/hived/workdir_*"
    - "haf/hive/tests/python/api_tests/pattern_tests/results.xml"

  tags:
  - data-cache-storage
  - fast

postgrest_pattern_tests:
  extends: .pattern_tests
  # Pattern tests are tied to specific blockchain data indexed by develop branch HAF
  # Allow failure when using a different HAF commit (feature branches with HAF changes)
  allow_failure: true

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME

new_style_postgrest_pattern_tests:
  extends: .pattern_tests
  # Pattern tests are tied to specific blockchain data indexed by develop branch HAF
  # Allow failure when using a different HAF commit (feature branches with HAF changes)
  allow_failure: true

  needs:
  - !reference [.pattern_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    # Direct call version does not support condenser_api
    TEST_SUITE: "account_history_api"
    DIRECT_CALLS: 1

.comparison_tests:
  extends: .comparison_tests_template
  stage: test
  variables:
    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    POETRY_INSTALL_ROOT_DIR: ${POETRY_INSTALL_DIR}
    COMPARISON_TESTS_DIR: "$CI_PROJECT_DIR/haf/hive/tests/python/api_tests/comparsion_tests"
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_USER: "hafah_user"

    HIVED_UID: $HIVED_UID

  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_data
    artifacts: true
    optional: true
  - job: prepare_hived_data
    artifacts: true
    optional: true

  artifacts:
    paths:
    - "$CI_JOB_NAME"
    - "**/from_node.log"
    - "**/ah.log"
    - "**/*.out.json"

    reports:
      junit: "haf/hive/tests/python/api_tests/comparsion_tests/comparsion_tests.xml"

  tags:
  - data-cache-storage
  - fast

postgrest_comparison_tests:
  extends: .comparison_tests

  needs:
  - !reference [.comparison_tests, needs]
  - job: prepare_postgrest_hafah_image
    artifacts: true

  variables:
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME

.benchmark_tests:
  extends: .jmeter_benchmark_with_haf_job
  stage: test
  variables:
    FF_NETWORK_PER_BUILD: 1
    API_FOR_TESTING: "account_history_api" # alternatively: blocks_api
    HIVED_UID: $HIVED_UID
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: $APP_PORT
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_data
    artifacts: true
    optional: true
  - job: prepare_postgrest_hafah_image
    artifacts: true

  script:
  - /usr/bin/python3 "${BENCHMARK_SOURCE_DIR}/benchmark.py" -a app -p $APP_PORT -c
    perf_5M_heavy.csv -d $CI_PROJECT_DIR/wdir -n $API_FOR_TESTING
  - m2u --input wdir/raw_jmeter_report.xml --output wdir/jmeter_junit_report.xml
  - jmeter -g wdir/jmeter_${APP_PORT}_output.csv -o wdir/dashboard/
  artifacts:
    paths:
    - wdir/
    reports:
      junit: wdir/jmeter_junit_report.xml
  tags:
  - data-cache-storage
  - fast

postgrest_block_api_benchmark_tests:
  extends: .benchmark_tests
  # Benchmark tests may fail when using non-develop HAF commit due to different service behavior
  allow_failure: true
  variables:
    API_FOR_TESTING: blocks_api

postgrest_account_history_benchmark_tests:
  extends: .benchmark_tests
  # Benchmark tests may fail when using non-develop HAF commit due to different service behavior
  allow_failure: true

postgrest_rest_benchmark_tests:
  extends: .jmeter_benchmark_with_haf_job
  stage: test
  # Benchmark tests may fail when using non-develop HAF commit due to different service behavior
  allow_failure: true
  variables:
    FF_NETWORK_PER_BUILD: 1
    HIVED_UID: $HIVED_UID
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: $APP_PORT
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_data
    artifacts: true
    optional: true
  - job: prepare_postgrest_hafah_image
    artifacts: true
  script:
  - sleep 10
  - timeout -k 1m 10m ./tests/performance/run_performance_tests.sh --backend-host=app
    --backend-port=$APP_PORT
  - tar -czvf tests/performance/results.tar.gz $(pwd)/tests/performance/*result.*
  - cat jmeter.log | python3 tests/performance/parse-jmeter-output.py
  - m2u --input $(pwd)/tests/performance/result.xml --output $(pwd)/tests/performance/junit-result.xml
  artifacts:
    paths:
    - docker/container-logs.tar.gz
    - tests/performance/result_report/
    - tests/performance/results.tar.gz
    - jmeter.log
    when: always
    reports:
      junit: tests/performance/junit-result.xml
  tags:
  - data-cache-storage
  - fast

cleanup_hive_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_hive_*"
  tags:
  - data-cache-storage
  - fast

cleanup_haf_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_haf_*"
  tags:
  - data-cache-storage
  - fast

build_and_publish_image:
  stage: publish
  extends: .publish_docker_image_template
  before_script:
  - !reference [.publish_docker_image_template, before_script]
  script:
  - scripts/ci-helpers/build_and_publish_instance.sh
  tags:
  - public-runner-docker

prepare_haf_image_testnet:
  extends: .prepare_haf_image
  stage: build
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    REGISTRY_USER: "$CI_IMG_BUILDER_USER"
    REGISTRY_PASS: $CI_IMG_BUILDER_PASSWORD
    HIVE_NETWORK_TYPE: testnet
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-testnet-binaries"
  tags:
  - public-runner-docker

.haf-instance-with-nfs-fallback: &haf-instance-with-nfs-fallback
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PGCTLTIMEOUT: 600
    PG_ACCESS: |
      "host    all              haf_admin        0.0.0.0/0    trust"
      "host    all              hived            0.0.0.0/0    trust"
      "host    all              hafah_user       0.0.0.0/0    trust"
      "host    all              all              0.0.0.0/0    scram-sha-256"
    DATA_SOURCE: "${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
    DATA_SOURCE_NFS_PREFIX: "${DATA_CACHE_NFS_PREFIX}"
    DATA_SOURCE_NFS_TYPE: "haf"
    DATA_SOURCE_NFS_KEY: "${HAF_COMMIT}"
  entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      ORIGINAL_SOURCE="${DATA_SOURCE}"
      NFS_PREFIX="${DATA_SOURCE_NFS_PREFIX:-/nfs/ci-cache}"
      NFS_TYPE="${DATA_SOURCE_NFS_TYPE:-haf}"
      NFS_KEY="${DATA_SOURCE_NFS_KEY}"
      if [[ ! -d "${ORIGINAL_SOURCE}/datadir" ]]; then
        NFS_PATH="${NFS_PREFIX}/${NFS_TYPE}/${NFS_KEY}"
        if [[ -d "${NFS_PATH}/datadir" ]]; then
          export DATA_SOURCE="$NFS_PATH"
        fi
      fi
      exec /home/haf_admin/docker_entrypoint.sh "$@"
    - '/bin/bash'
  command: ["--execute-maintenance-script=${HAF_SOURCE_DIR}/scripts/maintenance-scripts/sleep_infinity.sh"]

# Testnet HAF instance - starts with empty database, no pre-existing data required
.haf-instance-testnet: &haf-instance-testnet
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PGCTLTIMEOUT: 600
    PG_ACCESS: |
      "host    all              haf_admin        0.0.0.0/0    trust"
      "host    all              hived            0.0.0.0/0    trust"
      "host    all              hafah_user       0.0.0.0/0    trust"
      "host    all              all              0.0.0.0/0    scram-sha-256"
  command: ["--execute-maintenance-script=${HAF_SOURCE_DIR}/scripts/maintenance-scripts/sleep_infinity.sh"]

.hafah_pytest_fuctional_tests_base:
  extends: .pytest_based_template
  stage: test
  needs:
  - job: prepare_haf_image_testnet
    artifacts: true
  - job: prepare_postgrest_hafah_image
    artifacts: true

  services:
  - *haf-instance-testnet
  - name: ${HAF_APP_IMAGE}
    alias: app-setup
    variables:
        # intentionally use setup way chosed in haf_api_node compose scripts
      POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      echo "Attempting to perform application setup..."
      # pass control to the default image entrypoint
      "./docker_entrypoint.sh" "install_app"
      echo "Application setup completed, starting to listed app port to satisfy Gitlab health checker..."
      # Once setup completed, just listen on container/app port to satisfy GitlabCI HealthChecker
      nc -v -l -p $(echo "${HAF_APP_PORT}")
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'

  - name: ${HAF_APP_IMAGE}
    alias: app
    command: ["--postgres-url=postgresql://hafah_user@haf-instance/haf_block_log"]
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      # since Gitlab services startup order is undefined, we need to wait for app setup completion
      "/home/hafah_user/app/scripts/wait_for_setup_completed.sh" "$@"
      echo "Application setup finished - continue app-service spawn..."
      # pass control to the default image entrypoint
      /home/hafah_user/docker_entrypoint.sh run "$@"
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'
  variables:
    JUNIT_REPORT: tests/integration/functional/report.xml
    PYTEST_BASED_IMAGE_NAME: $BUILDER_IMAGE_PATH
    POETRY_INSTALL_ROOT_DIR: $CI_PROJECT_DIR/tests/integration/hafah-local-tools

    BINARY_CACHE_PATH: "haf-testnet-binaries"
    HIVED_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/hived"
    COMPRESS_BLOCK_LOG_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/compress_block_log"
    GET_DEV_KEY_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/get_dev_key"
    CLI_WALLET_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/cli_wallet"
    DB_NAME: haf_block_log
    DB_URL: "postgresql://haf_admin@haf-instance:5432/$DB_NAME"
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: ${APP_PORT}
    DIRECT_CALLS: 0
    POSTGRES_URL: $DB_URL
  script:
  - echo "HAfAH image name $HAF_APP_IMAGE"
  - echo "HAF image name $HAF_IMAGE_NAME"
    # run tests
  - cd $CI_PROJECT_DIR/tests/integration/functional
  - pytest --junitxml report.xml --postgrest-hafah-adress=app:$APP_PORT --postgres-db-url=$DB_URL
    -m $PYTEST_MARK
  tags:
  - public-runner-docker

hafah_pytest_rest_api_pattern_tests:
  extends: .pytest_based_template
  stage: test
  # Pattern tests are tied to specific blockchain data indexed by develop branch HAF
  # Allow failure when using a different HAF commit (feature branches with HAF changes)
  allow_failure: true
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: prepare_haf_data
    artifacts: true
    optional: true
  - job: prepare_postgrest_hafah_image
    artifacts: true
  services:
  - *haf-instance-with-nfs-fallback
  - name: ${HAF_APP_IMAGE}
    alias: app-setup
    variables:
        # intentionally use setup way chosed in haf_api_node compose scripts
      POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
    command: ["install_app"]
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      echo "Attempting to perform application setup..."
      # pass control to the default image entrypoint
      "./docker_entrypoint.sh" "$@"
      echo "Application setup completed, starting to listed app port to satisfy Gitlab health checker..."
      # Once setup completed, just listen on container/app port to satisfy GitlabCI HealthChecker
      nc -v -l -p $(echo "${HAF_APP_PORT}")
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'

  - name: ${HAF_APP_IMAGE}
    alias: app
    command: ["--postgres-url=postgresql://hafah_user@haf-instance/haf_block_log"]
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      # since Gitlab services startup order is undefined, we need to wait for app setup completion
      "/home/hafah_user/app/scripts/wait_for_setup_completed.sh" "$@"
      echo "Application setup finished - continue app-service spawn..."
      # pass control to the default image entrypoint
      /home/hafah_user/docker_entrypoint.sh "$@"
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'
  variables:
    DATA_SOURCE: "${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
    JUNIT_REPORT: $CI_PROJECT_DIR/tests/tavern/report.xml
    PYTEST_BASED_IMAGE_NAME: $BUILDER_IMAGE_PATH
    POETRY_INSTALL_ROOT_DIR: $CI_PROJECT_DIR/haf/hive/tests/python/hive-local-tools
    TAVERN_DIR: $CI_PROJECT_DIR/tests/tavern
    DB_NAME: haf_block_log
    DB_URL: "postgresql://haf_admin@haf-instance:5432/$DB_NAME"
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_HOST: app
    DIRECT_CALLS: 0
    POSTGRES_URL: $DB_URL
  script:
  - |
    echo "HAfAH image name $HAF_APP_IMAGE"
    echo "HAF image name $HAF_IMAGE_NAME"
    cd $CI_PROJECT_DIR/tests/tavern
    pytest -n $PYTEST_NUMBER_OF_PROCESSES --junitxml report.xml .
  artifacts:
    paths:
    - "**/*.out.json"
  tags:
  - data-cache-storage
  - fast

