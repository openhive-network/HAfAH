.hafah_pytest_fuctional_tests_base:
  extends: .pytest_based_template
  stage: test
  needs:
  - job: find_haf_image
    artifacts: true
  - job: find_haf_testnet_image
    artifacts: true
  - job: extract_testnet_binaries
    artifacts: true
  - job: prepare_postgrest_hafah_image
    artifacts: true

  # Clone HAF and hive test tools at runtime using reusable template
  # hafah-local-tools has path dependencies to haf/ and haf/hive/ directories
  # Note: HAF_COMMIT is mapped from HAF_UPSTREAM_COMMIT in variables section
  before_script:
    - !reference [.clone_haf_and_hive_test_tools, script]
    # Fix Python version constraint in pyproject.toml files (test-tools requires 3.14 but we use 3.12)
    - |
      cd "${CI_PROJECT_DIR}/haf/hive"
      sed -i 's/python = ">=3\.14,<4"/python = ">=3.12,<4"/' tests/python/hive-local-tools/pyproject.toml
      sed -i 's/python = ">=3\.14,<4"/python = ">=3.12,<4"/' tests/python/hive-local-tools/test-tools/pyproject.toml
      sed -i 's/python = ">=3\.14,<4"/python = ">=3.12,<4"/' tests/python/hive-local-tools/shared-tools/pyproject.toml
      cd "${CI_PROJECT_DIR}"
    # Install libpq-dev for psycopg2 build (CI base image runs as root)
    - apt-get update && apt-get install -y libpq-dev
    # Poetry install (from .pytest_based_template)
    - python3 -m venv venv/
    - . venv/bin/activate
    - echo "Entering ${POETRY_INSTALL_ROOT_DIR}"
    - cd "${POETRY_INSTALL_ROOT_DIR}"
    - poetry install

  services:
  - *haf-instance-testnet
  - name: ${HAF_APP_IMAGE}
    alias: app-setup
    variables:
        # intentionally use setup way chosed in haf_api_node compose scripts
      POSTGRES_URL: "postgresql://haf_admin@haf-instance/haf_block_log"
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      echo "Attempting to perform application setup..."
      # pass control to the default image entrypoint
      "./docker_entrypoint.sh" "install_app"
      echo "Application setup completed, starting to listen on app port to satisfy Gitlab health checker..."
      # Once setup completed, just listen on container/app port to satisfy GitlabCI HealthChecker
      nc -v -l -p $(echo "${HAF_APP_PORT}")
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'

  - name: ${HAF_APP_IMAGE}
    alias: app
    command: ["--postgres-url=postgresql://hafah_user@haf-instance/haf_block_log"]
    entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      # since Gitlab services startup order is undefined, we need to wait for app setup completion
      # Use haf_admin to check for setup (hafah_user doesn't exist until app-setup creates it)
      "/home/hafah_user/app/scripts/wait_for_setup_completed.sh" --postgres-url="postgresql://haf_admin@haf-instance/haf_block_log"
      echo "Application setup finished - continue app-service spawn..."
      # pass control to the default image entrypoint
      /home/hafah_user/docker_entrypoint.sh run "$@"
     # arg $0 should be explicitly passed when using 'bash -c' entrypoints
    - '/bin/bash'
  variables:
    JUNIT_REPORT: tests/integration/functional/report.xml
    # Use builder image with Python 3.14 (hafah-local-tools requires Python ^3.14)
    PYTEST_BASED_IMAGE_NAME: $BUILDER_IMAGE_PATH
    POETRY_INSTALL_ROOT_DIR: $CI_PROJECT_DIR/tests/integration/hafah-local-tools
    # Map HAF_TESTNET_UPSTREAM_IMAGE from find_haf_testnet_image to HAF_IMAGE_NAME for services
    HAF_IMAGE_NAME: "${HAF_TESTNET_UPSTREAM_IMAGE}"
    # Map HAF_UPSTREAM_COMMIT for .clone_haf_and_hive_test_tools script
    HAF_COMMIT: "${HAF_UPSTREAM_COMMIT}"

    # Binaries extracted from pre-built testnet image by extract_testnet_binaries job
    BINARY_CACHE_PATH: "haf-testnet-binaries"
    HIVED_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/hived"
    COMPRESS_BLOCK_LOG_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/compress_block_log"
    GET_DEV_KEY_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/get_dev_key"
    CLI_WALLET_PATH: "$CI_PROJECT_DIR/$BINARY_CACHE_PATH/cli_wallet"
    DB_NAME: haf_block_log
    DB_URL: "postgresql://haf_admin@haf-instance:5432/$DB_NAME"
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: ${APP_PORT}
    DIRECT_CALLS: 0
    POSTGRES_URL: $DB_URL
  script:
  - echo "HAfAH image name $HAF_APP_IMAGE"
  - echo "HAF image name $HAF_IMAGE_NAME"
    # run tests
  - cd $CI_PROJECT_DIR/tests/integration/functional
  - pytest --junitxml report.xml --postgrest-hafah-adress=app:$APP_PORT --postgres-db-url=$DB_URL
    -m $PYTEST_MARK
  tags:
  - public-runner-docker

hafah_pytest_rest_api_pattern_tests:
  stage: test
  # Use specific tag with util-linux for NFS flock support (not :latest which has BusyBox flock)
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-builder:${DOCKER_BUILDER_TAG}
  needs:
  - job: find_haf_image
    artifacts: true
  - job: prepare_haf_data
    artifacts: true
    optional: true
  - job: prepare_postgrest_hafah_image
    artifacts: true
  services:
  - name: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-dind:${DOCKER_DIND_TAG}
    alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
    # Map HAF_UPSTREAM_* from find_haf_image to HAF_* for cache-manager and docker-compose
    HAF_COMMIT: "${HAF_UPSTREAM_COMMIT}"
    HAF_IMAGE_NAME: "${HAF_UPSTREAM_IMAGE}"
    # Data directories for docker-compose bind mounts
    HAF_DATA_DIRECTORY: "${CI_PROJECT_DIR}/haf-data"
    HAF_SHM_DIRECTORY: "${CI_PROJECT_DIR}/haf-shm"
    # Test configuration
    JUNIT_REPORT: $CI_PROJECT_DIR/tests/tavern/report.xml
    PYTEST_BASED_IMAGE_NAME: ${PYTEST_RUNTIME_IMAGE_NAME}
    TAVERN_DIR: $CI_PROJECT_DIR/tests/tavern
    DB_NAME: haf_block_log
    DB_URL: "postgresql://haf_admin@localhost:5432/$DB_NAME"
    HAF_APP_IMAGE: $HAFAH_IMAGE_NAME
    HAF_APP_PORT: ${APP_PORT}
    HAF_APP_HOST: localhost
    DIRECT_CALLS: 0
    POSTGRES_URL: $DB_URL
  before_script:
  - |
    # Clean up stale data directories from previous runs (may be root-owned from Docker)
    # Docker-builder is Alpine-based without sudo, so use Docker to clean up as root
    # Wait for Docker daemon with timeout, then use alpine container to remove directories
    echo "Cleaning up stale data directories..."
    CLEANUP_TIMEOUT=30
    CLEANUP_START=$(date +%s)
    while ! docker info >/dev/null 2>&1; do
      ELAPSED=$(($(date +%s) - CLEANUP_START))
      if [[ $ELAPSED -ge $CLEANUP_TIMEOUT ]]; then
        echo "Docker not available for cleanup, trying fallback..."
        rm -rf "${HAF_DATA_DIRECTORY}" "${HAF_SHM_DIRECTORY}" 2>/dev/null || true
        break
      fi
      sleep 1
    done
    if docker info >/dev/null 2>&1; then
      docker run --rm -v "${CI_PROJECT_DIR}:/workspace" alpine:latest \
        sh -c "rm -rf /workspace/haf-data /workspace/haf-shm" 2>/dev/null || true
    fi

    echo -e "\e[0Ksection_start:$(date +%s):cache[collapsed=true]\r\e[0KFetching HAF cache..."
    # Use cache-manager to extract HAF data directly to target directory
    # cache-manager handles local/NFS fallback and permission restoration
    CACHE_MANAGER="/tmp/cache-manager.sh"
    curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
    chmod +x "$CACHE_MANAGER"
    mkdir -p "${HAF_DATA_DIRECTORY}" "${HAF_SHM_DIRECTORY}"
    if "$CACHE_MANAGER" get haf "${HAF_COMMIT}" "${HAF_DATA_DIRECTORY}"; then
      echo "HAF data extracted to ${HAF_DATA_DIRECTORY}"
    else
      echo "ERROR: Failed to get HAF cache for ${HAF_COMMIT}"
      exit 1
    fi
    echo -e "\e[0Ksection_end:$(date +%s):cache\r\e[0K"
  - |
    echo -e "\e[0Ksection_start:$(date +%s):docker[collapsed=true]\r\e[0KStarting docker-compose environment..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    export HAF_IMAGE_NAME="${HAF_IMAGE_NAME}"
    export HAFAH_IMAGE_NAME="${HAFAH_IMAGE_NAME}"
    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-compose.sh"
    echo -e "\e[0Ksection_end:$(date +%s):docker\r\e[0K"
  script:
  - |
    echo "HAfAH image name $HAFAH_IMAGE_NAME"
    echo "HAF image name $HAF_IMAGE_NAME"
    # Run pytest from a Python container connected to the haf-network
    # This allows pytest to reach the hafah service at hafah-ci-hafah-1:6543
    # Use Python 3.12 image - tests_api requires Python 3.12+
    # Tavern tests require validate_response module from hive/tests_api
    docker run --rm --network haf-network \
      -e HAF_APP_HOST=hafah-ci-hafah-1 \
      -e HAF_APP_PORT=${APP_PORT} \
      -e TAVERN_DIR=/workspace/tests/tavern \
      -v "${CI_PROJECT_DIR}:/workspace" \
      -w /workspace \
      python:3.12-slim \
      /bin/bash -c "
        # Clone and install tests_api for validate_response module
        apt-get update && apt-get install -y --no-install-recommends git ca-certificates >/dev/null 2>&1
        git clone --depth 1 https://gitlab.syncad.com/hive/tests_api.git /tmp/tests_api
        pip install --quiet /tmp/tests_api
        # Install tavern test dependencies
        pip install --quiet tavern pytest-xdist pyyaml requests deepdiff
        # Run tests
        cd /workspace/tests/tavern
        pytest -n ${PYTEST_NUMBER_OF_PROCESSES:-4} --junitxml report.xml .
      "
  after_script:
  - |
    cd "${CI_PROJECT_DIR}/docker"
    docker compose --env-file ci.env -f docker-compose.ci.yml logs > docker-compose-logs.txt 2>&1 || true
    docker compose --env-file ci.env -f docker-compose.ci.yml down --volumes || true

    # Clean up data directories to prevent permission issues for next job
    # Use Docker to remove as root since docker-builder doesn't have sudo
    docker run --rm -v "${CI_PROJECT_DIR}:/workspace" alpine:latest \
      sh -c "rm -rf /workspace/haf-data /workspace/haf-shm" 2>/dev/null || \
      rm -rf "${HAF_DATA_DIRECTORY}" "${HAF_SHM_DIRECTORY}" 2>/dev/null || true
  artifacts:
    paths:
    - "**/*.out.json"
    - docker/docker-compose-logs.txt
    when: always
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

hafah_pytest_fuctional_tests_part1:
  extends: .hafah_pytest_fuctional_tests_base
  variables:
    PYTEST_MARK: "enum_virtual_ops_and_get_ops_in_block"

hafah_pytest_fuctional_tests_part2:
  extends: .hafah_pytest_fuctional_tests_base
  variables:
    PYTEST_MARK: "get_account_history_and_get_transaction"

deploy-wax-spec-dev-package:
  extends: .npm_deploy_package_template
  stage: publish
  variables:
    # Override dotenv variables - they contain absolute paths that
    # don't work across different runner slots with GIT_CLONE_PATH
    SOURCE_DIR: "${CI_PROJECT_DIR}/build/generated"
    NPM_PACKAGE_SCOPE: "@hiveio"
  before_script:
    - !reference [.npm_based_job_base, before_script]
    # Find the tarball dynamically - filename includes version
    - PACKAGE_TGZ_PATH=$(ls ${CI_PROJECT_DIR}/build/*.tgz | head -1)
    - echo -e "\e[0Ksection_start:$(date +%s):package_tgz_unpack[collapsed=true]\r\e[0KUnpacking ${PACKAGE_TGZ_PATH}"
    - cd "${CI_PROJECT_DIR}"
    - tar -xf "${PACKAGE_TGZ_PATH}" -C "${SOURCE_DIR}" --strip-components=1
    - echo -e "\e[0Ksection_end:$(date +%s):package_tgz_unpack\r\e[0K"
  needs:
  - job: generate-wax-spec
    artifacts: true
  tags:
  - public-runner-docker

deploy-wax-spec-production-public-npm:
  extends: .registry_npmjs_org_deploy_package_template
  stage: publish
  variables:
    NPM_PUBLISH_TOKEN: "$INTERNAL_HIDDEN_PUBLISH_TOKEN"
    NPM_PACKAGE_NAME: "wax-api-hafah"
    # Override dotenv variables - they contain absolute paths that
    # don't work across different runner slots with GIT_CLONE_PATH
    SOURCE_DIR: "${CI_PROJECT_DIR}/build/generated"
  before_script:
    - !reference [.npm_based_job_base, before_script]
    # Find the tarball dynamically - filename includes version
    - PACKAGE_TGZ_PATH=$(ls ${CI_PROJECT_DIR}/build/*.tgz | head -1)
    - echo -e "\e[0Ksection_start:$(date +%s):package_tgz_unpack[collapsed=true]\r\e[0KUnpacking ${PACKAGE_TGZ_PATH}"
    - cd "${CI_PROJECT_DIR}"
    - tar -xf "${PACKAGE_TGZ_PATH}" -C "${SOURCE_DIR}" --strip-components=1
    - echo -e "\e[0Ksection_end:$(date +%s):package_tgz_unpack\r\e[0K"
  needs:
  - job: generate-wax-spec
    artifacts: true
  tags:
  - public-runner-docker
