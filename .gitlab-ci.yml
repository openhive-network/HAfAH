stages:
- detect
- build
- test
- publish
- cleanup

variables:
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Disable automatic submodule fetching - we handle it manually in before_script
  # This is needed because haf contains nested hive submodule with relative URLs
  GIT_SUBMODULE_STRATEGY: none
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Allow file:// protocol for nested submodules (required for test-tools in hive)
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: "protocol.file.allow"
  GIT_CONFIG_VALUE_0: "always"
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  CI_DEBUG_SERVICES: "true"
  # ci-base-image version is inherited from HAF's ci_image_tag_vars.yml via TEST_HAF_IMAGE_TAG
  BUILDER_IMAGE_TAG: "$TEST_HAF_IMAGE_TAG"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"

  # Use the same Python 3.14 base image as develop for pytest compatibility
  PYTEST_RUNTIME_IMAGE_NAME: "${BUILDER_IMAGE_PATH}"
  # Enable PyO3 forward compatibility for Python 3.14 (rpds-py build support)
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  POETRY_INSTALL_DIR: "${CI_PROJECT_DIR}/haf/hive/tests/python/hive-local-tools"

  SETUP_SCRIPTS_PATH: "$CI_PROJECT_DIR/haf/scripts"
  REGISTRY: registry.gitlab.syncad.com/hive/hafah
  BLOG_REGISTRY: registry-upload.hive.blog/hafah
  APP_PORT: 6543
  BENCHMARK_SOURCE_DIR: "$CI_PROJECT_DIR/haf/hive/tests/python/hive-local-tools/tests_api/benchmarks"

  # Allow access from any network to eliminate CI IP addressing problems
  HAF_DB_ACCESS: |
    "host    all              haf_admin        0.0.0.0/0    trust"
    "host    all              hived            0.0.0.0/0    trust"
    "host    all              hafah_user       0.0.0.0/0    trust"
    "host    all              all              0.0.0.0/0    scram-sha-256"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip data preparation and use cached HAF data:
  #
  # 1. AUTOMATIC: When only tests/docs/SQL change, data prep is automatically
  #    skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list below)
  #
  # Find available caches:
  #   ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # Or use: ../haf/scripts/ci-helpers/list-haf-caches.sh --recent
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true - HAF commit with cached data
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only tests/docs/SQL changed

  # Variables specific to runner (there is single runner cache and there is 5m block_log available)
  DATA_CACHE_HIVE_PREFIX: "/cache/replay_data_hive"
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  # HAF submodule commit - must match the 'ref:' in the include section below
  # This is needed for service containers which can't access dotenv artifacts
  HAF_COMMIT: "a9d236ef60e9551eb98be16a00fca1cb22be4b49"

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/haf'
  ref: a9d236ef60e9551eb98be16a00fca1cb22be4b49   # fix/ci-base-image-version
  file: '/scripts/ci-helpers/prepare_data_image_job.yml'
  # Do not include common-ci-configuration here, it is already referenced by scripts/ci-helpers/prepare_data_image_job.yml included from Haf/Hive repos

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        echo "pre_get_sources: checking $(pwd) for corrupt git state"
        if [ -d ".git" ]; then
          # Remove stale lock files that block git operations
          find .git -name "*.lock" -delete 2>/dev/null || true

          # Check if main repo is corrupt - if so, remove .git to force fresh clone
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "pre_get_sources: main repository corrupt, forcing fresh clone"
            rm -rf .git
          else
            # Main repo OK - check and clean corrupt submodules
            # Check both the working dir and .git/modules/ since either can be corrupt
            if [ -f ".gitmodules" ]; then
              git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
                needs_clean=false
                [ -z "$submod" ] && continue
                # Check if submodule working directory exists but is corrupt
                if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                  if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                    needs_clean=true
                  fi
                fi
                # Check if .git/modules exists but is corrupt (even if working dir is gone)
                if [ -d ".git/modules/$submod" ]; then
                  if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                    echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                    needs_clean=true
                  fi
                fi
                if [ "$needs_clean" = true ]; then
                  echo "pre_get_sources: cleaning corrupt submodule: $submod"
                  rm -rf "$submod" ".git/modules/$submod"
                fi
              done
            fi
            echo "pre_get_sources: existing repo OK"
          fi
        else
          echo "pre_get_sources: no .git directory (fresh workspace)"
        fi
        )
  before_script:
    # Initialize submodules manually (GIT_SUBMODULE_STRATEGY: none)
    # Skip if git not available (some jobs use minimal images)
    - |
      if command -v git >/dev/null 2>&1; then
        echo -e "\e[0Ksection_start:$(date +%s):init_submodules[collapsed=true]\r\e[0KInitializing submodules..."
        git config --global --add safe.directory '*'
        # Get the commit we need from the haf submodule
        HAF_URL="https://gitlab.syncad.com/hive/haf.git"
        HAF_SUBMOD_COMMIT=$(git ls-tree HEAD haf | awk '{print $3}')
        echo "Need haf submodule at commit $HAF_SUBMOD_COMMIT"
        # Remove existing haf directory if it exists (can be stale from GIT_STRATEGY=fetch)
        sudo rm -rf haf 2>/dev/null || rm -rf haf
        # Clone and checkout specific commit
        git clone --no-checkout "$HAF_URL" haf
        cd haf
        git fetch origin develop
        git checkout $HAF_SUBMOD_COMMIT
        # Initialize nested submodules inside haf (hive and its submodules)
        git submodule update --init --recursive --jobs 4
        cd ..
        echo -e "\e[0Ksection_end:$(date +%s):init_submodules\r\e[0K"
      fi

validate_haf_commit:
  stage: build
  image: alpine:latest
  script:
  - |
    set -e
    apk add --no-cache git
    # Initialize submodules (default before_script skipped because alpine lacks git initially)
    # Use manual clone to avoid nested submodule issues with relative URLs
    git config --global --add safe.directory '*'
    HAF_URL="https://gitlab.syncad.com/hive/haf.git"
    HAF_SUBMOD_COMMIT=$(git ls-tree HEAD haf | awk '{print $3}')
    echo "Need haf submodule at commit $HAF_SUBMOD_COMMIT"
    rm -rf haf
    git clone --no-checkout "$HAF_URL" haf
    cd haf
    git fetch origin develop
    git checkout $HAF_SUBMOD_COMMIT
    git submodule update --init --recursive --jobs 4
    cd ..
    SUBMODULE_COMMIT=$(git -C haf rev-parse HEAD)
    INCLUDE_REF=$(grep -A2 "project:.*hive/haf" .gitlab-ci.yml | grep "ref:" | head -1 | sed 's/.*ref: *\([a-f0-9]*\).*/\1/' || true)
    echo "HAF_COMMIT variable: $HAF_COMMIT"
    echo "HAF submodule HEAD:  $SUBMODULE_COMMIT"
    echo "Include ref:         $INCLUDE_REF"
    ERRORS=0
    if [ "$HAF_COMMIT" != "$SUBMODULE_COMMIT" ]; then
      echo "ERROR: HAF_COMMIT variable does not match submodule commit!"
      ERRORS=1
    fi
    if [ "$HAF_COMMIT" != "$INCLUDE_REF" ]; then
      echo "ERROR: HAF_COMMIT variable does not match include ref!"
      ERRORS=1
    fi
    if [ $ERRORS -eq 1 ]; then
      exit 1
    fi
    echo "All HAF commit references are consistent"
  tags:
  - public-runner-docker

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/hafah-local-tools"
