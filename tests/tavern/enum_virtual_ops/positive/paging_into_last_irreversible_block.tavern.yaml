---
  test_name: Hafah JSON-RPC enum_virtual_ops paging inside the last irreversible block

  includes:
    - !include ../../common.yaml

  stages:
    - name: a full first page stops inside block 5000000
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          jsonrpc: "2.0"
          method: account_history_api.enum_virtual_ops
          params:
            block_range_begin: 5000000
            block_range_end: 5000010
            limit: 1
          id: 1
      response:
        status_code: 200
        verify_response_with:
          function: tavern.helpers:validate_content
          extra_kwargs:
            comparisons:
              - jmespath: "result.ops[*].[block, operation_id]"
                operator: eq
                expected:
                  - [5000000, "21474836480000001"]
              - jmespath: "result.[next_block_range_begin, next_operation_begin]"
                operator: eq
                expected: [5000000, "21474836480000003"]

    - name: following the cursor with the same end returns the rest of block 5000000
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          jsonrpc: "2.0"
          method: account_history_api.enum_virtual_ops
          params:
            block_range_begin: 5000000
            block_range_end: 5000010
            operation_begin: 21474836480000003
            limit: 1
          id: 1
      response:
        status_code: 200
        verify_response_with:
          function: tavern.helpers:validate_content
          extra_kwargs:
            comparisons:
              - jmespath: "result.ops[*].[block, operation_id]"
                operator: eq
                expected:
                  - [5000000, "21474836480000003"]
              - jmespath: "result.[next_block_range_begin, next_operation_begin]"
                operator: eq
                expected: [0, 0]
